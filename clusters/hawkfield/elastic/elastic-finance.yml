apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elastic-finance
  namespace: elastic-finance
spec:
  targetNamespace: elastic-finance
  interval: 10m
  chart:
    spec:
      chart: eck-operator
      version: '3.0.0'
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: elastic
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: elastic-values
      valuesKey: values.yaml