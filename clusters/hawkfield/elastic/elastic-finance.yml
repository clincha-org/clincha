apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elastic-finance
  namespace: flux-system
spec:
  targetNamespace: elastic-finance
  interval: 1m
  chart:
    spec:
      chart: eck-stack
      version: '0.15.0'
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: elastic-values
      valuesKey: values.yaml