apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elastic-operator
  namespace: flux-system
spec:
  targetNamespace: elastic
  interval: 1m
  chart:
    spec:
      chart: eck-operator
      version: '3.0.0'
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: flux-system
      interval: 1m