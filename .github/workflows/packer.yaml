name: Packer Build
permissions:
  contents: read
on:
  push:
    branches:
      - "master"
    paths:
      - "packer/**"
      - ".github/workflows/packer.yaml"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"
jobs:
  build:
    name: "Build (${{ matrix.host }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: hawk01
            proxmox_url: "https://10.1.2.11:8006"
            vm_id: 101
          - host: hawk02
            proxmox_url: "https://10.1.2.12:8006"
            vm_id: 102
          - host: hawk03
            proxmox_url: "https://10.1.2.13:8006"
            vm_id: 103
    concurrency:
      group: "packer-${{ matrix.host }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-routes

      - name: Verify network connectivity
        run: |
          echo "Checking connectivity to Proxmox on ${{ matrix.host }}..."
          curl -sk --connect-timeout 15 "${{ matrix.proxmox_url }}" || {
            echo "::error::Cannot reach Proxmox at ${{ matrix.proxmox_url }} — check Tailscale subnet routes"
            exit 1
          }
          echo "Proxmox reachable on ${{ matrix.host }}"

      - name: Install xorriso
        run: sudo apt-get install -y xorriso

      - name: Setup Packer
        uses: hashicorp/setup-packer@main

      - name: Packer Init
        working-directory: packer/ubuntu2404
        run: packer init .

      - name: Build and upload cloud-init ISO
        run: |
          API="${{ matrix.proxmox_url }}/api2/json"
          TOKEN="packer@pam!packer:${{ secrets.PACKER_PROXMOX_TOKEN }}"

          # Build the cloud-init ISO locally
          xorriso -as mkisofs -o /tmp/cidata.iso -V cidata -J -R packer/cloud-init/meta-data packer/cloud-init/user-data

          # Delete existing cidata.iso from Proxmox if present
          curl -sfk -X DELETE -H "Authorization: PVEAPIToken=$TOKEN" \
            "$API/nodes/${{ matrix.host }}/storage/local/content/local:iso/cidata.iso" || true

          # Upload the new ISO
          curl -sfk -X POST -H "Authorization: PVEAPIToken=$TOKEN" \
            -F "content=iso" -F "filename=@/tmp/cidata.iso" \
            "$API/nodes/${{ matrix.host }}/storage/local/upload"

      - name: Clean up existing VM
        run: |
          API="${{ matrix.proxmox_url }}/api2/json"
          TOKEN="packer@pam!packer:${{ secrets.PACKER_PROXMOX_TOKEN }}"

          echo "Checking for existing VM ${{ matrix.vm_id }} on ${{ matrix.host }}..."
          if curl -sfk -H "Authorization: PVEAPIToken=$TOKEN" "$API/nodes/${{ matrix.host }}/qemu/${{ matrix.vm_id }}/status/current" >/dev/null 2>&1; then
            echo "VM ${{ matrix.vm_id }} exists, stopping and destroying..."
            curl -sfk -X POST -H "Authorization: PVEAPIToken=$TOKEN" "$API/nodes/${{ matrix.host }}/qemu/${{ matrix.vm_id }}/status/stop" || true
            sleep 5
            curl -sfk -X DELETE -H "Authorization: PVEAPIToken=$TOKEN" "$API/nodes/${{ matrix.host }}/qemu/${{ matrix.vm_id }}?purge=1&destroy-unreferenced-disks=1" || true
            sleep 3
          else
            echo "No existing VM found"
          fi

      - name: Packer Build
        working-directory: packer/ubuntu2404
        run: |
          packer build \
            -var-file="${{ matrix.host }}.pkrvars.hcl" \
            -var "proxmox_token=${{ secrets.PACKER_PROXMOX_TOKEN }}" \
            -var "ssh_password=${{ secrets.PACKER_SSH_PASSWORD }}" \
            .
