name: Cluster Rebuild
permissions:
  contents: read
on:
  workflow_dispatch:
concurrency:
  group: "cluster-hawkfield"
jobs:
  destroy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify network connectivity
        run: |
          echo "Checking connectivity to MinIO..."
          curl -sf --connect-timeout 15 http://10.1.2.10:9000/minio/health/live || {
            echo "::error::Cannot reach MinIO at 10.1.2.10:9000 — check Tailscale subnet routes"
            exit 1
          }
          echo "MinIO reachable"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/hawkfield-kubernetes
        run: |
          terraform init -backend-config="secret_key=${{ secrets.MINIO_SECRET_KEY }}"

      - name: Terraform Destroy
        working-directory: terraform/hawkfield-kubernetes
        run: |
          terraform destroy -auto-approve -var-file=providers.tfvars -var="pm_api_token_secret=${{ secrets.PROXMOX_TOKEN_HAWKFIELD_TERRAFORM }}"

  provision:
    runs-on: ubuntu-latest
    needs: destroy
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify network connectivity
        run: |
          echo "Checking connectivity to MinIO..."
          curl -sf --connect-timeout 15 http://10.1.2.10:9000/minio/health/live || {
            echo "::error::Cannot reach MinIO at 10.1.2.10:9000 — check Tailscale subnet routes"
            exit 1
          }
          echo "MinIO reachable"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/hawkfield-kubernetes
        run: |
          terraform init -backend-config="secret_key=${{ secrets.MINIO_SECRET_KEY }}"

      - name: Terraform Plan
        working-directory: terraform/hawkfield-kubernetes
        run: |
          terraform plan -out=tfplan -var-file=providers.tfvars -var="pm_api_token_secret=${{ secrets.PROXMOX_TOKEN_HAWKFIELD_TERRAFORM }}"

      - name: Terraform Apply
        working-directory: terraform/hawkfield-kubernetes
        run: |
          terraform apply -auto-approve -var-file=providers.tfvars -var="pm_api_token_secret=${{ secrets.PROXMOX_TOKEN_HAWKFIELD_TERRAFORM }}" tfplan

  configure:
    runs-on: ubuntu-latest
    needs: provision
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Ansible
        working-directory: Ansible
        run: |
          pip install -r requirements.txt

      - name: Install Ansible collections
        working-directory: Ansible
        run: |
          ansible-galaxy collection install -r galaxy-requirements.yml

      - name: Setup vault password
        working-directory: Ansible
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > vault

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval `ssh-agent -s`
          ssh-add ~/.ssh/id_ed25519

      - name: Run Ansible playbook
        working-directory: Ansible
        env:
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_HAWKFIELD_ANSIBLE }}
          MINIO_KUBECONFIG_ACCESS_KEY: ${{ secrets.MINIO_KUBECONFIG_ACCESS_KEY }}
          MINIO_KUBECONFIG_SECRET_KEY: ${{ secrets.MINIO_KUBECONFIG_SECRET_KEY }}
        run: |
          ansible-playbook kubernetes.yml \
            --inventory inventory/hawkfield.proxmox.yml \
            --vault-password-file vault \
            --user ansible \
            --become \
            --become-user=root \
            --limit k8s_cluster
