name: Cluster Rebuild
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  # Gate carries no concurrency group: a job holds its group while waiting for
  # approval, which would lock the site for as long as nobody approves.
  approve:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Approved
        run: echo "Rebuild approved"

  destroy:
    runs-on: ubuntu-latest
    needs: approve
    concurrency:
      group: "cluster-hawkfield"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Terraform Init
        working-directory: terraform/hawkfield-kubernetes
        run: |
          terraform init -backend-config="secret_key=${{ secrets.RUSTFS_SECRET_KEY }}"

      - name: Terraform Destroy
        working-directory: terraform/hawkfield-kubernetes
        run: |
          terraform destroy -auto-approve -var-file=providers.tfvars -var="pm_api_token_secret=${{ secrets.PROXMOX_TOKEN_HAWKFIELD_TERRAFORM }}"

  provision:
    runs-on: ubuntu-latest
    needs: destroy
    concurrency:
      group: "cluster-hawkfield"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Terraform Init
        working-directory: terraform/hawkfield-kubernetes
        run: |
          terraform init -backend-config="secret_key=${{ secrets.RUSTFS_SECRET_KEY }}"

      - name: Terraform Plan
        working-directory: terraform/hawkfield-kubernetes
        run: |
          terraform plan -out=tfplan -var-file=providers.tfvars -var="pm_api_token_secret=${{ secrets.PROXMOX_TOKEN_HAWKFIELD_TERRAFORM }}"

      - name: Terraform Apply
        working-directory: terraform/hawkfield-kubernetes
        run: |
          terraform apply -auto-approve -var-file=providers.tfvars -var="pm_api_token_secret=${{ secrets.PROXMOX_TOKEN_HAWKFIELD_TERRAFORM }}" tfplan

  configure:
    runs-on: ubuntu-latest
    needs: provision
    concurrency:
      group: "cluster-hawkfield"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up Ansible
        uses: ./.github/actions/ansible-setup
        with:
          vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ssh-private-key: ${{ secrets.ANSIBLE_PRIVATE_KEY }}

      - name: Run Ansible playbook
        working-directory: Ansible
        env:
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_HAWKFIELD_ANSIBLE }}
          RUSTFS_KUBECONFIG_ACCESS_KEY: ${{ secrets.RUSTFS_KUBECONFIG_ACCESS_KEY }}
          RUSTFS_KUBECONFIG_SECRET_KEY: ${{ secrets.RUSTFS_KUBECONFIG_SECRET_KEY }}
        run: |
          ansible-playbook kubernetes.yml \
            --inventory inventory/hawkfield.proxmox.yml \
            --vault-password-file vault \
            --user ansible \
            --become \
            --become-user=root \
            --limit k8s_cluster
