name: Terraform Plan (PR)

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yaml"

concurrency:
  group: "terraform-plan-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  plan:
    name: "Plan (${{ matrix.site }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [hawkfield, london]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup WireGuard VPN
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
          
          # Write WireGuard config
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf > /dev/null
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = ${{ secrets.WG_ADDRESS }}

          [Peer]
          PublicKey = ${{ secrets.WG_PEER_PUBLIC_KEY }}
          Endpoint = ${{ secrets.WG_ENDPOINT }}
          AllowedIPs = ${{ secrets.WG_ALLOWED_IPS }}
          PersistentKeepalive = 25
          EOF
          
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          
          # Verify connectivity to MinIO
          echo "Checking connectivity to MinIO..."
          curl -sf --connect-timeout 10 http://10.1.2.10:9000/minio/health/live || {
            echo "::error::Cannot reach MinIO at 10.1.2.10:9000 — VPN tunnel may not be working"
            exit 1
          }
          echo "VPN connected and MinIO reachable ✓"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/${{ matrix.site }}
        run: |
          terraform init -backend-config="secret_key=${{ secrets.MINIO_SECRET_KEY }}"

      - name: Terraform Plan
        id: plan
        working-directory: terraform/${{ matrix.site }}
        continue-on-error: true
        run: |
          terraform plan -no-color \
            -var-file=providers.tfvars \
            -var="pm_api_token_secret=${{ secrets.PM_TF_API_TOKEN_SECRET }}" \
            -out=tfplan 2>&1 | tee plan_output.txt
          
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Save plan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.site }}
          path: terraform/${{ matrix.site }}/plan_output.txt

      - name: Teardown VPN
        if: always()
        run: sudo wg-quick down wg0 || true

  comment:
    name: "Post PR Comment"
    runs-on: ubuntu-latest
    needs: plan
    if: always()
    steps:
      - name: Download plan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plan-*

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sites = ['hawkfield', 'london'];
            let body = '## 🏗️ Terraform Plan Results\n\n';

            for (const site of sites) {
              const path = `plan-${site}/plan_output.txt`;
              let output = '⚠️ Plan output not available';
              try {
                output = fs.readFileSync(path, 'utf8');
              } catch (e) {
                // artifact may not exist if job was skipped
              }

              const hasChanges = output.includes('Plan:') && !output.includes('Plan: 0 to add, 0 to change, 0 to destroy');
              const noChanges = output.includes('No changes');
              const failed = output.includes('Error');

              let icon = '✅';
              if (failed) icon = '❌';
              else if (hasChanges) icon = '⚠️';

              body += `<details>\n`;
              body += `<summary>${icon} <strong>${site}</strong></summary>\n\n`;
              body += '```hcl\n' + output.slice(0, 60000) + '\n```\n';
              body += `</details>\n\n`;
            }

            body += `\n*Last updated: ${new Date().toISOString()}*`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Plan Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
