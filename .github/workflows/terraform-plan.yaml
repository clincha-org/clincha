name: Terraform Plan (PR)

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - "terraform/**"
      # Has its own workflow; this one would plan three Proxmox sites for nothing.
      - "!terraform/uptime-kuma/**"
      - "!terraform/watchdog/**"
      - ".github/workflows/terraform-plan.yaml"

concurrency:
  group: "terraform-plan-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  plan:
    if: github.actor != 'dependabot[bot]'
    name: "Plan (${{ matrix.site }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [hawkfield, hawkfield-kubernetes, london]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Terraform Init
        working-directory: terraform/${{ matrix.site }}
        run: |
          terraform init -backend-config="secret_key=${{ secrets.RUSTFS_SECRET_KEY }}"

      - name: Terraform Plan
        id: plan
        working-directory: terraform/${{ matrix.site }}
        continue-on-error: true
        run: |
          terraform plan -no-color \
            -var-file=providers.tfvars \
            -var="pm_api_token_secret=${{ startsWith(matrix.site, 'hawkfield') && secrets.PROXMOX_TOKEN_HAWKFIELD_TERRAFORM || secrets.PROXMOX_TOKEN_LONDON_TERRAFORM }}" \
            -out=tfplan 2>&1 | tee plan_output.txt

      - name: Save plan output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-${{ matrix.site }}
          path: terraform/${{ matrix.site }}/plan_output.txt

  comment:
    name: "Post PR Comment"
    runs-on: ubuntu-latest
    needs: plan
    if: always()
    steps:
      - name: Download plan artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: plan-*

      - name: Post plan to PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const sites = ['hawkfield', 'hawkfield-kubernetes', 'london'];
            let body = '## 🏗️ Terraform Plan Results\n\n';

            for (const site of sites) {
              const path = `plan-${site}/plan_output.txt`;
              let output = '⚠️ Plan output not available';
              try {
                output = fs.readFileSync(path, 'utf8');
              } catch (e) {
                // artifact may not exist if job was skipped
              }

              const hasChanges = output.includes('Plan:') && !output.includes('Plan: 0 to add, 0 to change, 0 to destroy');
              const noChanges = output.includes('No changes');
              const failed = output.includes('Error');

              let icon = '✅';
              if (failed) icon = '❌';
              else if (hasChanges) icon = '⚠️';

              body += `<details>\n`;
              body += `<summary>${icon} <strong>${site}</strong></summary>\n\n`;
              body += '```hcl\n' + output.slice(0, 60000) + '\n```\n';
              body += `</details>\n\n`;
            }

            body += `\n*Last updated: ${new Date().toISOString()}*`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Plan Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
