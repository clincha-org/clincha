name: Ansible Pi-hole DNS
permissions:
  contents: read
on:
  push:
    branches:
      - "master"
    paths:
      - '.github/workflows/ansible-pihole.yaml'
      - 'Ansible/**'
  workflow_dispatch:
concurrency:
  group: "pihole-${{ github.event.inputs.site || 'all' }}"
jobs:
  pihole:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [hawkfield, london]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Ansible
        working-directory: Ansible
        run: |
          pip install -r requirements.txt

      - name: Install Ansible collections
        working-directory: Ansible
        run: |
          ansible-galaxy collection install -r galaxy-requirements.yml

      - name: Setup vault password
        working-directory: Ansible
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > vault

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval `ssh-agent -s`
          ssh-add ~/.ssh/id_ed25519

      - name: Run Ansible playbook
        working-directory: Ansible
        env:
          PROXMOX_TOKEN_SECRET: ${{ matrix.site == 'hawkfield' && secrets.PROXMOX_TOKEN_HAWKFIELD_ANSIBLE || secrets.PROXMOX_TOKEN_LONDON_ANSIBLE }}
          PIHOLE_ADMIN_PASSWORD: ${{ matrix.site == 'hawkfield' && secrets.PIHOLE_ADMIN_PASSWORD_HAWKFIELD || secrets.PIHOLE_ADMIN_PASSWORD_LONDON }}
        run: |
          ansible-playbook pihole.yml \
            --inventory inventory/${{ matrix.site }}.proxmox.yml \
            --vault-password-file vault
