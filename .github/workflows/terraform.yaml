name: Terraform Apply
permissions:
  contents: read
on:
  push:
    branches:
      - "master"
    paths:
      - '.github/workflows/terraform.yaml'
      - 'terraform/**'
  workflow_dispatch:
jobs:
  plan:
    name: "Plan (${{ matrix.site }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [hawkfield, london]
    concurrency:
      group: "cluster-${{ matrix.site }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify network connectivity
        run: |
          echo "Checking connectivity to MinIO..."
          curl -sf --connect-timeout 15 http://10.1.2.10:9000/minio/health/live || {
            echo "::error::Cannot reach MinIO at 10.1.2.10:9000 — check Tailscale subnet routes"
            exit 1
          }
          echo "MinIO reachable"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/${{ matrix.site }}
        run: |
          terraform init -backend-config="secret_key=${{ secrets.MINIO_SECRET_KEY }}"

      - name: Terraform Plan
        working-directory: terraform/${{ matrix.site }}
        run: |
          terraform plan -out=tfplan -var-file=providers.tfvars -var="pm_api_token_secret=${{ matrix.site == 'hawkfield' && secrets.PROXMOX_TOKEN_HAWKFIELD_TERRAFORM || secrets.PROXMOX_TOKEN_LONDON_TERRAFORM }}"

      - name: Artifact Upload
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: 'error'
          path: terraform/${{ matrix.site }}/tfplan
          name: tfplan-${{ matrix.site }}

  apply:
    name: "Apply (${{ matrix.site }})"
    runs-on: ubuntu-latest
    needs: plan
    environment:
      name: production
    strategy:
      fail-fast: false
      matrix:
        site: [hawkfield, london]
    concurrency:
      group: "cluster-${{ matrix.site }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify network connectivity
        run: |
          echo "Checking connectivity to MinIO..."
          curl -sf --connect-timeout 15 http://10.1.2.10:9000/minio/health/live || {
            echo "::error::Cannot reach MinIO at 10.1.2.10:9000 — check Tailscale subnet routes"
            exit 1
          }
          echo "MinIO reachable"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ matrix.site }}
          path: terraform/${{ matrix.site }}/tfplan

      - name: Terraform Init
        working-directory: terraform/${{ matrix.site }}
        run: |
          terraform init -backend-config="secret_key=${{ secrets.MINIO_SECRET_KEY }}"

      - name: Terraform Apply
        working-directory: terraform/${{ matrix.site }}
        run: |
          terraform apply -auto-approve -var-file=providers.tfvars -var="pm_api_token_secret=${{ matrix.site == 'hawkfield' && secrets.PROXMOX_TOKEN_HAWKFIELD_TERRAFORM || secrets.PROXMOX_TOKEN_LONDON_TERRAFORM }}" tfplan/tfplan
