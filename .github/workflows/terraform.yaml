name: Terraform Apply
permissions:
  contents: read
on:
  push:
    branches:
      - "master"
    paths:
      - '.github/workflows/terraform.yaml'
      - 'terraform/**'
  workflow_dispatch:
jobs:
  plan:
    name: "Plan (${{ matrix.site }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [hawkfield, hawkfield-kubernetes, london]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Terraform Init
        working-directory: terraform/${{ matrix.site }}
        run: |
          terraform init -backend-config="secret_key=${{ secrets.RUSTFS_SECRET_KEY }}"

      - name: Terraform Plan
        working-directory: terraform/${{ matrix.site }}
        run: |
          terraform plan -out=tfplan -var-file=providers.tfvars -var="pm_api_token_secret=${{ startsWith(matrix.site, 'hawkfield') && secrets.PROXMOX_TOKEN_HAWKFIELD_TERRAFORM || secrets.PROXMOX_TOKEN_LONDON_TERRAFORM }}"

      - name: Artifact Upload
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: 'error'
          path: terraform/${{ matrix.site }}/tfplan
          name: tfplan-${{ matrix.site }}

  # Gate carries no concurrency group: a job holds its group while waiting for
  # approval, which would lock every site for as long as nobody approves.
  approve:
    name: "Approve"
    runs-on: ubuntu-latest
    needs: plan
    environment:
      name: production
    steps:
      - name: Approved
        run: echo "Apply approved"

  apply:
    name: "Apply (${{ matrix.site }})"
    runs-on: ubuntu-latest
    needs: approve
    strategy:
      fail-fast: false
      matrix:
        site: [hawkfield, hawkfield-kubernetes, london]
    concurrency:
      group: "cluster-${{ matrix.site }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ matrix.site }}
          path: terraform/${{ matrix.site }}/tfplan

      - name: Terraform Init
        working-directory: terraform/${{ matrix.site }}
        run: |
          terraform init -backend-config="secret_key=${{ secrets.RUSTFS_SECRET_KEY }}"

      - name: Terraform Apply
        working-directory: terraform/${{ matrix.site }}
        run: |
          terraform apply -auto-approve -var-file=providers.tfvars -var="pm_api_token_secret=${{ startsWith(matrix.site, 'hawkfield') && secrets.PROXMOX_TOKEN_HAWKFIELD_TERRAFORM || secrets.PROXMOX_TOKEN_LONDON_TERRAFORM }}" tfplan/tfplan
