name: Terraform Apply
permissions:
  contents: read
on:
  push:
    branches:
      - "master"
    paths:
      - '.github/workflows/terraform.yaml'
      - 'terraform/**'
  workflow_dispatch:
concurrency:
  group: "${{github.workflow}}"
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-routes

      - name: Verify network connectivity
        run: |
          echo "Checking connectivity to MinIO..."
          curl -sf --connect-timeout 15 http://10.1.2.10:9000/minio/health/live || {
            echo "::error::Cannot reach MinIO at 10.1.2.10:9000 — check Tailscale subnet routes"
            exit 1
          }
          echo "MinIO reachable"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/hawkfield
        run: |
          terraform init -backend-config="secret_key=${{ secrets.MINIO_SECRET_KEY }}"

      - name: Terraform Plan
        working-directory: terraform/hawkfield
        run: |
          terraform plan -out=tfplan -var-file=providers.tfvars -var="pm_api_token_secret=${{ secrets.PM_TF_API_TOKEN_SECRET }}"

      - name: Artifact Upload
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: 'error'
          path: terraform/hawkfield/tfplan
          name: tfplan-hawkfield

  apply:
    runs-on: ubuntu-latest
    needs: plan
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-routes

      - name: Verify network connectivity
        run: |
          echo "Checking connectivity to MinIO..."
          curl -sf --connect-timeout 15 http://10.1.2.10:9000/minio/health/live || {
            echo "::error::Cannot reach MinIO at 10.1.2.10:9000 — check Tailscale subnet routes"
            exit 1
          }
          echo "MinIO reachable"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-hawkfield
          path: terraform/hawkfield/tfplan

      - name: Terraform Init
        working-directory: terraform/hawkfield
        run: |
          terraform init -backend-config="secret_key=${{ secrets.MINIO_SECRET_KEY }}"

      - name: Terraform Apply
        working-directory: terraform/hawkfield
        run: |
          terraform apply -auto-approve -var-file=providers.tfvars -var="pm_api_token_secret=${{ secrets.PM_TF_API_TOKEN_SECRET }}" tfplan/tfplan
