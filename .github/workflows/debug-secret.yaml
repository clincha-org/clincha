name: Debug Secret
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  write-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.ANSIBLE_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Write secret to remote file
        run: |
          ssh -o StrictHostKeyChecking=no ansible@10.1.2.101 \
            "echo '${{ secrets.PROXMOX_PASSWORD }}' > /tmp/secret.txt"
