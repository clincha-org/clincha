name: Ansible Proxmox Bootstrap
permissions:
  contents: read
on:
  workflow_dispatch:
concurrency:
  group: "${{github.workflow}}"
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      PROXMOX_PASSWORD: ${{ secrets.PROXMOX_ROOT_PASSWORD }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up Ansible
        uses: ./.github/actions/ansible-setup

      - name: Run bootstrap playbook
        working-directory: Ansible
        run: |
          ansible-playbook proxmox-bootstrap.yml \
            --inventory inventory/bootstrap.yml
