name: Terraform setup
description: Connect to Tailscale, check RustFS connectivity, install Terraform.
inputs:
  ts-oauth-client-id:
    description: Tailscale OAuth client ID.
    required: true
  ts-oauth-secret:
    description: Tailscale OAuth secret.
    required: true
runs:
  using: composite
  steps:
    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:ci

    - name: Verify network connectivity
      shell: bash
      run: |
        echo "Checking connectivity to RustFS..."
        health=http://10.1.2.10:30293/health
        curl -sf --connect-timeout 15 "$health" || {
          echo "::error::Cannot reach RustFS at 10.1.2.10:30293 —" \
            "check Tailscale subnet routes"
          exit 1
        }
        echo "RustFS reachable"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
