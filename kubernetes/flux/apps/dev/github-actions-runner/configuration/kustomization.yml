apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: github-actions-runner-controller-dev
resources:
  - ../../../base/github-actions-runner/configuration/clincha
  - ../../../base/github-actions-runner/configuration/elasticstar
configMapGenerator:
  - name: values.yaml
    behavior: merge
    literals:
      - runnerGroup=dev
      - runnerScaleSetName=clincha-runners-dev