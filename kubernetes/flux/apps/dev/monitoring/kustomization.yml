apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: monitoring-dev
resources:
  - ../../base/monitoring
patches:
  - target:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: grafana-certificate
      namespace: monitoring
    path: certificate-patch.yml
configMapGenerator:
  - name: prometheus-values
    namespace: monitoring
    files:
      - values.yml
    options:
      disableNameSuffixHash: true