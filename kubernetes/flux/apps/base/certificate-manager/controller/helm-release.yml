---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: certificate-manager
  namespace: flux-system
spec:
  targetNamespace: certificate-manager
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: '1.18.2'
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: certificate-manager-values
      valuesKey: values.yaml