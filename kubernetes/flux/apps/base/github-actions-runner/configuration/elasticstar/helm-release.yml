---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runners-elasticstar
  namespace: gha-elasticstar
spec:
  targetNamespace: gha-elasticstar
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: gha-elasticstar-values