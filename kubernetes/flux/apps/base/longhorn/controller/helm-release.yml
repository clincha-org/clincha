---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn
spec:
  targetNamespace: longhorn
  interval: 1m
  chart:
    spec:
      chart: longhorn
      version: '1.9.0'
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: longhorn-values
      valuesKey: values.yml