apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elastic
  namespace: logging
spec:
  targetNamespace: logging
  interval: 1m
  chart:
    spec:
      chart: eck-stack-with-fleet
      version: '0.15.0'
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: elastic-operator
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: elastic-values
      valuesKey: values.yml