---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kibana-certificate
  namespace: elastic-finance
spec:
  secretName: kibana-certificate-secret
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - kibana.dev.clincha.co.uk
    - kibana.dev.clinch-home.com