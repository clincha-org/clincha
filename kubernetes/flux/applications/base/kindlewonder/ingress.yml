---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kindlewonder
  namespace: kindlewonder
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
spec:
  ingressClassName: nginx
  rules:
    - host: kindlewonder.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kindlewonder
                port:
                  number: 80
    - host: www.kindlewonder.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kindlewonder
                port:
                  number: 80
