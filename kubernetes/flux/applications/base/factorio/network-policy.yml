---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: factorio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-game-traffic
  namespace: factorio
spec:
  podSelector:
    matchLabels:
      name: factorio
  policyTypes:
    - Ingress
  ingress:
    # The Service is externalTrafficPolicy: Local, so players keep their real
    # source address. They arrive from the internet over a port forward, so
    # there is no narrower range than "anywhere" to write here.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 34197
