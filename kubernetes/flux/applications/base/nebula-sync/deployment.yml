---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-sync
  namespace: nebula-sync
  labels:
    name: nebula-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      name: nebula-sync
  template:
    metadata:
      labels:
        name: nebula-sync
    spec:
      containers:
        - name: nebula-sync
          image: ghcr.io/lovelaze/nebula-sync:latest
          env:
            - name: PRIMARY_HOST_BASE_URL
              value: "http://10.1.2.131"
            - name: PRIMARY_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nebula-sync-secrets
                  key: primary-password
            - name: REPLICA_1_HOST_BASE_URL
              value: "http://10.2.2.131"
            - name: REPLICA_1_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nebula-sync-secrets
                  key: replica-1-password
            - name: FULL_SYNC
              value: "true"
            - name: CRON
              value: "0 */30 * * * *"
