---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: giftlist
  namespace: giftlist
  annotations:
    # Per-IP, now that ingress-nginx trusts Cloudflare's real client IP
    # instead of its shared edge pool (clincha#495).
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: nginx
  tls:
    - secretName: giftlist-certificate-secret
  rules:
    - host: gifts.clinch-home.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: giftlist
                port:
                  number: 80
    - host: gifts.clincha.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: giftlist
                port:
                  number: 80
