apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: satisfactory
resources:
  - ../../base/satisfactory
  - persistent-volumes.yml
configMapGenerator:
  - name: satisfactory-values
    namespace: satisfactory
    files:
      - values.yml
    options:
      disableNameSuffixHash: true
