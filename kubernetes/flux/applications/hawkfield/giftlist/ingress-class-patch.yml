apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: giftlist
  namespace: giftlist
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: null
    nginx.ingress.kubernetes.io/limit-burst-multiplier: null
    traefik.ingress.kubernetes.io/router.middlewares: giftlist-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik-public
