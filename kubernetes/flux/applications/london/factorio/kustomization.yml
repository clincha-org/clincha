apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: factorio
resources:
  - ../../base/factorio
patches:
  - target:
      group: apps
      kind: Deployment
      version: v1
      namespace: factorio
      name: factorio
    path: deployment-patch.yml
configMapGenerator:
  - name: factorio-server-settings
    namespace: factorio
    files:
      - server-settings.json
      - server-whitelist.json
      - server-adminlist.json
      - map-gen-settings.json
      - map-settings.json