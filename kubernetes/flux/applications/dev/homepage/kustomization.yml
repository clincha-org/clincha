apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: homepage-dev
resources:
  - ../../base/homepage
patches:
  - target:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: grafana-certificate
      namespace: monitoring
    path: certificate-patch.yml
  - target:
      kind: Ingress
      group: networking.k8s.io
      version: v1
      name: homepage
      namespace: homepage
    path: ingress-patch.yml