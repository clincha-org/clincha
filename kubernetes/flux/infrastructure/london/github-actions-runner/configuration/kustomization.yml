apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: github-actions-runner-controller
resources:
  - ../../../base/github-actions-runner/configuration/clincha
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: runners-clincha
      namespace: gha-clincha
    path: helm-release-patch.yml