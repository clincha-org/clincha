apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: github-actions-runner-controller
resources:
  - ../../../base/github-actions-runner/configuration/clincha
  - ../../../base/github-actions-runner/configuration/elasticstar
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: runners-clincha
      namespace: gha-clincha
    path: helm-release-patch.yml
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: runners-elasticstar
      namespace: gha-elasticstar
    path: helm-release-patch.yml