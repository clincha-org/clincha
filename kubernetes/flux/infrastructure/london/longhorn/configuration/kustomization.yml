apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: longhorn-configuration
resources:
  - ../../../base/longhorn/configuration
patches:
  - target:
      group: storage.k8s.io
      version: v1
      kind: StorageClass
      name: fast
      namespace: longhorn
    path: storage-class-patch.yml
