- op: replace
  path: /metadata/name
  value: k8s-lon-1
- op: replace
  path: /metadata/annotations/node.longhorn.io~1default-disks-config # ~1 represents /
  value: |-
    [
      {
        "name": "fast",
        "path": "/var/lib/longhorn",
        "allowScheduling": true,
        "tags": [
          "fast"
        ]
      }
    ]