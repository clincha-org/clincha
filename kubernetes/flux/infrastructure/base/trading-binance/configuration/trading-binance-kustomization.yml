---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trading-binance
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: trading-binance
  path: ./kubernetes
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg-trading
