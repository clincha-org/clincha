---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: nginx-ingress
spec:
  targetNamespace: nginx-ingress
  interval: 1m
  chart:
    spec:
      chart: nginx-ingress
      version: '4.14.1'
      sourceRef:
        kind: HelmRepository
        name: nginx-ingress
        namespace: nginx-ingress
      interval: 1m