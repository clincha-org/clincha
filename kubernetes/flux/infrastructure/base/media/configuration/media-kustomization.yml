---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media
  namespace: flux-system
spec:
  interval: 5m
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: media
  path: /
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
