---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  targetNamespace: headlamp
  releaseName: headlamp
  interval: 1m
  chart:
    spec:
      chart: headlamp
      version: '0.46.0'
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: headlamp
      interval: 1m
  values:
    # The chart default binds its ServiceAccount to cluster-admin.
    clusterRoleBinding:
      clusterRoleName: view
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
