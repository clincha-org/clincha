---
apiVersion: v1
kind: ConfigMap
metadata:
  name: restore-script
  namespace: longhorn
data:
  restore.sh: |
    #!/bin/bash
    set -euo pipefail

    RESTORE_TIMEOUT=${RESTORE_TIMEOUT:-300}
    DISCOVERY_TIMEOUT=${DISCOVERY_TIMEOUT:-300}
    REPLICAS=${REPLICAS:-3}

    log() { echo "[$(date -u '+%Y-%m-%d %H:%M:%S')] $*"; }

    wait_for_backup_volumes() {
      local elapsed=0
      while [ $elapsed -lt "$DISCOVERY_TIMEOUT" ]; do
        local count
        count=$(kubectl get backupvolumes.longhorn.io -n longhorn --no-headers 2>/dev/null | wc -l)
        if [ "$count" -gt 0 ]; then
          log "Found $count backup volumes"
          return 0
        fi
        log "Waiting for backup volumes to appear ($elapsed/${DISCOVERY_TIMEOUT}s)..."
        sleep 5
        elapsed=$((elapsed + 5))
      done
      log "ERROR: No backup volumes found after ${DISCOVERY_TIMEOUT}s"
      return 1
    }

    get_restore_targets() {
      kubectl get backupvolumes.longhorn.io -n longhorn -o json | python3 -c '
    import json, sys

    data = json.load(sys.stdin)
    targets = {}

    for item in data.get("items", []):
        status = item.get("status", {})
        labels = status.get("labels", {})
        ks_raw = labels.get("KubernetesStatus", "{}")
        ks = json.loads(ks_raw)

        pvc_name = ks.get("pvcName", "")
        namespace = ks.get("namespace", "")
        access_mode = labels.get("longhorn.io/volume-access-mode", "rwo")
        size = status.get("size", "0")
        last_backup = status.get("lastBackupName", "")
        last_backup_at = status.get("lastBackupAt", "")

        if not pvc_name or not namespace or not last_backup:
            continue

        key = f"{namespace}/{pvc_name}"
        if key not in targets or last_backup_at > targets[key]["last_backup_at"]:
            targets[key] = {
                "pvc_name": pvc_name,
                "namespace": namespace,
                "access_mode": access_mode,
                "size": size,
                "last_backup": last_backup,
                "last_backup_at": last_backup_at,
            }

    result = list(targets.values())
    json.dump(result, sys.stdout)
    '
    }

    get_backup_url() {
      local backup_name=$1
      kubectl get "backups.longhorn.io/${backup_name}" -n longhorn \
        -o jsonpath='{.status.url}' 2>/dev/null
    }

    volume_exists() {
      local name=$1
      kubectl get "volumes.longhorn.io/${name}" -n longhorn &>/dev/null
    }

    get_volume_state() {
      local name=$1
      kubectl get "volumes.longhorn.io/${name}" -n longhorn \
        -o jsonpath='{.status.state}:{.status.restoreRequired}' 2>/dev/null
    }

    pv_exists() {
      local name=$1
      kubectl get "pv/${name}" &>/dev/null
    }

    pvc_exists() {
      local name=$1 namespace=$2
      kubectl get "pvc/${name}" -n "$namespace" &>/dev/null
    }

    create_longhorn_volume() {
      local name=$1 size=$2 backup_url=$3 access_mode=$4
      local k8s_access="rwo"
      [ "$access_mode" = "rwx" ] && k8s_access="rwx"

      cat <<VOLUME_EOF | kubectl apply -f -
    apiVersion: longhorn.io/v1beta2
    kind: Volume
    metadata:
      name: ${name}
      namespace: longhorn
      labels:
        recurring-job-group.longhorn.io/daily-backup: enabled
    spec:
      size: "${size}"
      numberOfReplicas: ${REPLICAS}
      fromBackup: "${backup_url}"
      accessMode: ${k8s_access}
      frontend: blockdev
      diskSelector:
        - fast
    VOLUME_EOF
    }

    wait_for_restore() {
      local name=$1
      local elapsed=0
      while [ $elapsed -lt "$RESTORE_TIMEOUT" ]; do
        local state
        state=$(get_volume_state "$name")
        local vol_state="${state%%:*}"
        local restore_required="${state##*:}"

        if [ "$vol_state" = "detached" ] && [ "$restore_required" = "false" ]; then
          return 0
        fi
        log "  Waiting for ${name}: state=${vol_state} restoreRequired=${restore_required} (${elapsed}/${RESTORE_TIMEOUT}s)"
        sleep 10
        elapsed=$((elapsed + 10))
      done
      return 1
    }

    create_pv() {
      local name=$1 pvc_name=$2 namespace=$3 size_bytes=$4 access_mode=$5
      local size_gi="$((size_bytes / 1073741824))Gi"
      local k8s_access="ReadWriteOnce"
      [ "$access_mode" = "rwx" ] && k8s_access="ReadWriteMany"

      cat <<PV_EOF | kubectl apply -f -
    apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: ${name}
    spec:
      capacity:
        storage: ${size_gi}
      volumeMode: Filesystem
      accessModes:
        - ${k8s_access}
      persistentVolumeReclaimPolicy: Retain
      storageClassName: fast
      csi:
        driver: driver.longhorn.io
        fsType: ext4
        volumeAttributes:
          staleReplicaTimeout: "2880"
        volumeHandle: ${name}
      claimRef:
        name: ${pvc_name}
        namespace: ${namespace}
    PV_EOF
    }

    main() {
      log "Starting Longhorn backup restore"

      if ! wait_for_backup_volumes; then
        exit 1
      fi

      local targets
      targets=$(get_restore_targets)
      local count
      count=$(echo "$targets" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
      log "Found ${count} deduplicated volumes to process"

      local successes=0
      local failures=0
      local skipped=0

      echo "$targets" | python3 -c '
    import json, sys
    for t in json.load(sys.stdin):
        print(t["pvc_name"] + "|" + t["namespace"] + "|" + t["size"] + "|" + t["access_mode"] + "|" + t["last_backup"])
    ' | while IFS='|' read -r pvc_name namespace size access_mode last_backup; do

        log "Processing ${namespace}/${pvc_name}"

        # Skip if PV already exists and is bound
        if pv_exists "$pvc_name"; then
          log "  SKIP: PV ${pvc_name} already exists"
          skipped=$((skipped + 1))
          continue
        fi

        # Handle existing Longhorn volume
        if volume_exists "$pvc_name"; then
          local state
          state=$(get_volume_state "$pvc_name")
          local vol_state="${state%%:*}"
          local restore_required="${state##*:}"

          if [ "$vol_state" = "detached" ] && [ "$restore_required" = "false" ]; then
            log "  Volume already restored, creating PV"
            if create_pv "$pvc_name" "$pvc_name" "$namespace" "$size" "$access_mode"; then
              log "  SUCCESS: PV created for ${pvc_name}"
              successes=$((successes + 1))
            else
              log "  ERROR: Failed to create PV for ${pvc_name}"
              failures=$((failures + 1))
            fi
            continue
          fi

          # Volume exists but in bad state — delete and recreate
          log "  Deleting existing volume in state ${vol_state}"
          kubectl delete "volumes.longhorn.io/${pvc_name}" -n longhorn --timeout=60s 2>/dev/null || true
          sleep 5
        fi

        # Get backup URL
        local backup_url
        backup_url=$(get_backup_url "$last_backup")
        if [ -z "$backup_url" ]; then
          log "  ERROR: Could not get backup URL for ${last_backup}"
          failures=$((failures + 1))
          continue
        fi

        log "  Restoring from ${backup_url}"

        # Create Longhorn volume from backup
        if ! create_longhorn_volume "$pvc_name" "$size" "$backup_url" "$access_mode"; then
          log "  ERROR: Failed to create volume ${pvc_name}"
          failures=$((failures + 1))
          continue
        fi

        # Wait for restore
        if ! wait_for_restore "$pvc_name"; then
          log "  ERROR: Restore timed out for ${pvc_name}"
          failures=$((failures + 1))
          continue
        fi
        log "  Volume restored successfully"

        # Create PV with claimRef
        if ! create_pv "$pvc_name" "$pvc_name" "$namespace" "$size" "$access_mode"; then
          log "  ERROR: Failed to create PV for ${pvc_name}"
          failures=$((failures + 1))
          continue
        fi

        log "  SUCCESS: ${namespace}/${pvc_name} restored"
        successes=$((successes + 1))
      done

      log "Restore complete: ${successes} succeeded, ${failures} failed, ${skipped} skipped"

      if [ "$successes" -eq 0 ] && [ "$skipped" -eq 0 ] && [ "$failures" -gt 0 ]; then
        log "ERROR: All volumes failed to restore"
        exit 1
      fi
    }

    main "$@"
