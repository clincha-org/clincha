---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  targetNamespace: monitoring
  interval: 30m
  chart:
    spec:
      chart: kube-state-metrics
      version: '7.4.0'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1m
  values:
    # Scraped by the Alloy DaemonSet (kube_state_metrics job), not Prometheus
    # Operator, so no ServiceMonitor is created.
    prometheus:
      monitor:
        enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    service:
      port: 8080
