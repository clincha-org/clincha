---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  targetNamespace: monitoring
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: '1.11.0'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: alloy-values
      valuesKey: values.yml