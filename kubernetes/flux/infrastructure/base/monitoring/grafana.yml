---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus
spec:
  replicas: 1
  # Recreate, not RollingUpdate: /var/lib/grafana is a shared NFS mount and the
  # bleve unified-search index takes an exclusive lock, so a surged second pod
  # crash-loops until the old one goes away.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/instance: k8s
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: kube-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        app.kubernetes.io/instance: k8s
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: kube-prometheus
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: grafana/grafana:13.1.3
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            limits:
              cpu: 2
              memory: 4G
            requests:
              cpu: 1
              memory: 1G
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 3005
            runAsGroup: 3005
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-storage
              readOnly: false
            - mountPath: /usr/share/grafana/data/plugins-bundled
              name: plugins
            - mountPath: /tmp
              name: tmp
            - mountPath: /etc/grafana/provisioning/dashboards
              name: dashboard-provider
              readOnly: true
            - mountPath: /etc/grafana/dashboards
              name: dashboards
              readOnly: true
      volumes:
        - name: grafana-storage
          nfs:
            path: /mnt/data/grafana
            server: 10.1.2.10
        - name: tmp
          emptyDir:
            medium: Memory
        - name: plugins
          emptyDir:
            medium: Memory
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus
spec:
  selector:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus
  ports:
    - port: 3000
      name: http
      targetPort: http