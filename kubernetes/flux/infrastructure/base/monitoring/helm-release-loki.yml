---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  targetNamespace: monitoring
  interval: 30m
  chart:
    spec:
      chart: loki
      version: '7.0.0'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
      valuesKey: values.yml