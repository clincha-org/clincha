---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-api-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: truenas-api-exporter
    app.kubernetes.io/component: truenas-api-exporter
    app.kubernetes.io/part-of: kube-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: truenas-api-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: truenas-api-exporter
        app.kubernetes.io/component: truenas-api-exporter
        app.kubernetes.io/part-of: kube-prometheus
    spec:
      serviceAccountName: truenas-api-exporter
      automountServiceAccountToken: false
      containers:
        - name: exporter
          image: python:3.12-slim
          command: ["python3", "/app/truenas_exporter.py"]
          env:
            - name: TRUENAS_HOST
              value: "10.1.2.10"
            - name: LISTEN_PORT
              value: "9113"
            # API key for the least-privilege `nasexporter` TrueNAS user
            # (read-only roles). REST rejects non-admin keys, so the exporter
            # uses the JSON-RPC WebSocket API.
            - name: TRUENAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: truenas-api-credentials
                  key: api-key
          ports:
            - name: metrics
              containerPort: 9113
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: metrics
          # tcpSocket, not /metrics: an HTTP probe would drive a full TrueNAS
          # API scrape on every check.
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - mountPath: /app
              name: script
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: script
          configMap:
            name: truenas-exporter-script
---
apiVersion: v1
kind: Service
metadata:
  name: truenas-api-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: truenas-api-exporter
    app.kubernetes.io/component: truenas-api-exporter
    app.kubernetes.io/part-of: kube-prometheus
spec:
  selector:
    app.kubernetes.io/name: truenas-api-exporter
  ports:
    - name: metrics
      port: 9113
      targetPort: metrics
      protocol: TCP
