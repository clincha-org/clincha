---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  targetNamespace: monitoring
  interval: 1m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '75.7.0'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: prometheus-values
      valuesKey: values.yml