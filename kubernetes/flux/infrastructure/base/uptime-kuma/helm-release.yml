---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  targetNamespace: uptime-kuma
  interval: 1m
  chart:
    spec:
      chart: uptime-kuma
      version: '2.24.0'
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
        namespace: uptime-kuma
      interval: 1m
  # Values are inline rather than valuesFrom: helm-controller does not watch the
  # referenced ConfigMap, so an edit there needs a manual --force reconcile.
  values:
    # /app/data is the SQLite database. Mounted from hawkstore NFS rather than a
    # PVC — a Longhorn journal abort silently wedged two volumes with EIO for 18
    # days on 2026-07-08.
    volume:
      enabled: false
    additionalVolumes:
      - name: storage
        nfs:
          server: 10.1.2.10
          path: /mnt/data/uptime-kuma
    additionalVolumeMounts:
      - name: storage
        mountPath: /app/data
    # The export is root_squash and the image defaults to root.
    podSecurityContext:
      runAsUser: 3019
      runAsGroup: 3021
      fsGroup: 3021
      runAsNonRoot: true