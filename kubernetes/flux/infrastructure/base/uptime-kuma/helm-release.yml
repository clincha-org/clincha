---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  targetNamespace: uptime-kuma
  interval: 1m
  chart:
    spec:
      chart: uptime-kuma
      version: '4.1.0'
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
        namespace: uptime-kuma
      interval: 1m
  # Values are inline rather than valuesFrom: helm-controller does not watch the
  # referenced ConfigMap, so an edit there needs a manual --force reconcile.
  values:
    # Ahead of the chart's appVersion (2.3.0) to match what
    # breml/uptimekuma tests against. 2.3.0 has no `bearer_token` column on
    # `monitor`, so every Terraform-created HTTP monitor fails on INSERT.
    # Drop this once the chart ships an appVersion of 2.4.0 or later.
    image:
      tag: "2.4.0"
    # The monitoring data lives in MariaDB on hawkstore (the TrueNAS `mariadb`
    # app, on local ZFS). SQLite on the NFS mount below could not keep up: fsync
    # there costs 58-105ms against 7ms locally, so a WAL insert took ~558ms and
    # the pod restarted 228 times in 5 days. Env wins over db-config.json and
    # rewrites it, so this switch needs no manual file surgery.
    externalDatabase:
      enabled: true
      type: mariadb
      hostname: 10.1.2.10
      port: 3306
      database: uptime_kuma
      existingSecret: uptime-kuma-mariadb-credentials
      existingSecretUsernameKey: username
      existingSecretPasswordKey: password
    # /app/data still holds db-config.json, uploads, screenshots and docker-tls
    # — all low-traffic. Mounted from hawkstore NFS rather than a PVC because a
    # Longhorn journal abort silently wedged two volumes with EIO for 18 days on
    # 2026-07-08.
    volume:
      enabled: false
    additionalVolumes:
      - name: storage
        nfs:
          server: 10.1.2.10
          path: /mnt/data/uptime-kuma
    additionalVolumeMounts:
      - name: storage
        mountPath: /app/data
    # extra/entrypoint.sh chowns /app/data and then drops to PUID:PGID with
    # `setpriv --clear-groups`, which needs CAP_SETGID. Set root explicitly
    # rather than by omission: helm leaves a previously-rendered
    # securityContext in place when the key disappears from values, so the old
    # non-root one would persist.
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    podEnv:
      - name: PUID
        value: "3019"
      - name: PGID
        value: "3019"
    # Kept from the SQLite-on-NFS era. MariaDB removes the stall that used to
    # trip these, but the chart's 1s/2s defaults leave no room for a slow query
    # either, and a killed pod is a worse outcome than a slow one.
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 6
    # RollingUpdate surges a second pod (25% of 1 rounds up). Harmless against
    # MariaDB, but /app/data is still a shared RWX mount.
    strategy:
      type: Recreate