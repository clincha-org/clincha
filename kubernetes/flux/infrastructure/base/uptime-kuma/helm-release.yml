---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  targetNamespace: uptime-kuma
  interval: 1m
  chart:
    spec:
      chart: uptime-kuma
      version: '4.1.0'
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
        namespace: uptime-kuma
      interval: 1m
  # Values are inline rather than valuesFrom: helm-controller does not watch the
  # referenced ConfigMap, so an edit there needs a manual --force reconcile.
  values:
    # /app/data is the SQLite database. Mounted from hawkstore NFS rather than a
    # PVC — a Longhorn journal abort silently wedged two volumes with EIO for 18
    # days on 2026-07-08.
    volume:
      enabled: false
    additionalVolumes:
      - name: storage
        nfs:
          server: 10.1.2.10
          path: /mnt/data/uptime-kuma
    additionalVolumeMounts:
      - name: storage
        mountPath: /app/data
    # extra/entrypoint.sh chowns /app/data and then drops to PUID:PGID with
    # `setpriv --clear-groups`, which needs CAP_SETGID. Set root explicitly
    # rather than by omission: helm leaves a previously-rendered
    # securityContext in place when the key disappears from values, so the old
    # non-root one would persist.
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    podEnv:
      - name: PUID
        value: "3019"
      - name: PGID
        value: "3021"
    # SQLite fsync on that NFS mount runs 58-105ms against 7ms on local disk, so
    # a single WAL insert takes ~558ms. The chart's 1s/2s probe timeouts expire
    # whenever the stat_hourly aggregation holds the Knex pool, and the restart
    # re-runs the aggregation: 228 restarts in 5 days.
    readinessProbe:
      timeoutSeconds: 5
      failureThreshold: 6
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 6
    # RollingUpdate surges a second pod (25% of 1 rounds up), which would put
    # two writers on the one SQLite file.
    strategy:
      type: Recreate