apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elastic-operator
  namespace: elastic-operator
spec:
  targetNamespace: elastic-operator
  interval: 1m
  chart:
    spec:
      chart: eck-operator
      version: '3.4.1'
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: elastic-operator
      interval: 1m