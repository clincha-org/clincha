---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  targetNamespace: traefik
  interval: 1m
  chart:
    spec:
      chart: traefik
      version: '36.3.0'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
      valuesKey: values.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-values
  namespace: flux-system
data:
  values.yaml: |
    service:
      annotations:
        metallb.io/loadBalancerIPs: 10.1.2.205
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints: [web, websecure]
        matchRule: Host(`traefik.clinch-home.com`)
        tls:
          secretName: traefik-certificate-secret
    providers:
      kubernetesIngress:
        allowExternalNameServices: true