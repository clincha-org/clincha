---
apiVersion: v1
kind: Namespace
metadata:
  name: certificate-manager
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 1m
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: certificate-manager
  namespace: flux-system
spec:
  targetNamespace: certificate-manager
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: '1.18.2'
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: certificate-manager-values
      valuesKey: values.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: certificate-manager-values
  namespace: flux-system
data:
  values.yaml: |
    crds:
      enabled: true
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53