apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: ingress-nginx
resources:
  - ../../base/ingress-nginx
  - helm-release-public.yml
configurations:
  - nameref-helmrelease.yml
configMapGenerator:
  - namespace: ingress-nginx
    name: ingress-nginx-values
    files:
      - values.yml
  - namespace: ingress-nginx
    name: ingress-nginx-public-values
    files:
      - values-public.yml
