---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-public
  namespace: ingress-nginx
spec:
  targetNamespace: ingress-nginx
  interval: 1m
  chart:
    spec:
      chart: ingress-nginx
      version: '4.15.1'
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: ingress-nginx-public-values
      valuesKey: values-public.yml
