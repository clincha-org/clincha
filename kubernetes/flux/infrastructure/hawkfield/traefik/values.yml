deployment:
  replicas: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1
global:
  checkNewVersion: false
  sendAnonymousUsage: false
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-public
providers:
  kubernetesIngress:
    ingressClass: traefik-public
    publishedService:
      enabled: true
  kubernetesCRD:
    ingressClass: traefik-public
    allowCrossNamespace: false
ingressRoute:
  dashboard:
    enabled: false
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
service:
  annotations:
    metallb.io/loadBalancerIPs: 10.1.2.207
  spec:
    externalTrafficPolicy: Local
accessLog:
  enabled: true
  format: json
metrics:
  prometheus:
    service:
      enabled: true
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
