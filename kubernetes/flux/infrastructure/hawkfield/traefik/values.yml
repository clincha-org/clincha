global:
  checkNewVersion: false
  sendAnonymousUsage: false
deployment:
  replicas: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-public
api:
  dashboard: false
ingressRoute:
  dashboard:
    enabled: false
providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-public
accessLog:
  enabled: true
  format: json
  fields:
    headers:
      defaultMode: drop
      # ClientHost is always the TCP peer (a Cloudflare edge), so the client IP is read from these.
      names:
        Cf-Connecting-Ip: keep
        X-Forwarded-For: keep
metrics:
  prometheus:
    entryPoint: metrics
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    # Cloudflare's published edge ranges (https://www.cloudflare.com/ips-v4, https://www.cloudflare.com/ips-v6).
    # Traefik strips X-Forwarded-* from any other peer, so LAN clients can't spoof it.
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
service:
  annotations:
    metallb.io/loadBalancerIPs: 10.1.2.207
  spec:
    externalTrafficPolicy: Local
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik
