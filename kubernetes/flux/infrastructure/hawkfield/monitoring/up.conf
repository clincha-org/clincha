[poller]
  quiet = true

[prometheus]
  http_listen = "0.0.0.0:9130"
  report_errors = false
  # 5m rather than the 60s default: clincha#480. The A/B proved unpoller drives
  # ~30 of unifi-core's ~36 MB/day; if the cost is per poll cycle this cuts it
  # ~5x. Revert to "60s" if the slope does not move.
  interval = "5m"

[influxdb]
  disable = true

[loki]
  disable = true

[unifi]
  dynamic = false

[[unifi.controller]]
  url = "https://10.1.2.1"
  user = "unifipoller"
  # file:// reads the password from the mounted Secret at startup. Only the
  # path lives here, so this stays a plain ConfigMap.
  pass = "file:///secrets/unifi/bristol-password"
  sites = ["all"]
  save_sites = true
  save_dpi = false
  # UDMs serve a self-signed certificate.
  verify_ssl = false

[[unifi.controller]]
  url = "https://10.2.2.1"
  user = "unifipoller"
  pass = "file:///secrets/unifi/london-password"
  sites = ["all"]
  save_sites = true
  save_dpi = false
  verify_ssl = false
