[poller]
  quiet = true

[prometheus]
  http_listen = "0.0.0.0:9130"
  report_errors = false

[influxdb]
  disable = true

[loki]
  disable = true

[unifi]
  dynamic = false

[[unifi.controller]]
  url = "https://10.1.2.1"
  user = "unifipoller"
  # file:// reads the password from the mounted Secret at startup. Only the
  # path lives here, so this stays a plain ConfigMap.
  pass = "file:///secrets/unifi/bristol-password"
  sites = ["all"]
  # Temporarily disabled to isolate the unifi-core leak (clincha#480) — Bristol
  # is the treatment console, London stays save_sites=true as the control.
  save_sites = false
  save_dpi = false
  # UDMs serve a self-signed certificate.
  verify_ssl = false

[[unifi.controller]]
  url = "https://10.2.2.1"
  user = "unifipoller"
  pass = "file:///secrets/unifi/london-password"
  sites = ["all"]
  save_sites = true
  save_dpi = false
  verify_ssl = false
