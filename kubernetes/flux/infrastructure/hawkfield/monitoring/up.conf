[poller]
  quiet = true

[prometheus]
  http_listen = "0.0.0.0:9130"
  report_errors = false

[influxdb]
  disable = true

[loki]
  disable = true

[unifi]
  dynamic = false

# Controller order is load-bearing: UP_UNIFI_CONTROLLER_<n>_PASS binds by index.
[[unifi.controller]]
  url = "https://10.1.2.1"
  user = "unifipoller"
  sites = ["all"]
  save_sites = true
  save_dpi = false
  # UDMs serve a self-signed certificate.
  verify_ssl = false

[[unifi.controller]]
  url = "https://10.2.2.1"
  user = "unifipoller"
  sites = ["all"]
  save_sites = true
  save_dpi = false
  verify_ssl = false
