groups:
  # Fires forever on purpose. It proves Prometheus is evaluating rules and
  # Alertmanager is delivering; the London watchdog alerts when it stops
  # arriving. Nothing here can detect its own death, which is the point.
  - name: watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: 'alerting pipeline heartbeat'

  - name: pod-restarts
    rules:
      # 1h window rather than 15m: CrashLoopBackOff caps its backoff at
      # 5 minutes, so a 15m window tops out around 3 restarts, which puts
      # any threshold right on the boundary and makes it flap.
      - alert: PodRestartingFrequently
        expr: increase(kube_pod_container_status_restarts_total[1h]) >= 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'restarted {{ $value | printf "%.0f" }} times in the last hour'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/pod-restarts.md

      - alert: PodCrashLooping
        expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'stuck in CrashLoopBackOff for over 15 minutes'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/pod-restarts.md

  # kubelet, cAdvisor, kube-state-metrics and the node exporters all reach
  # Prometheus by remote_write from the Alloy DaemonSet, never by scrape. When
  # a sender cannot deliver, its series stop arriving: the targets go ABSENT,
  # they never go up == 0. Nothing keyed on up == 0 can see that, which is how
  # clincha#487 hid two thirds of the cluster's container telemetry for three
  # days behind panels that merely thinned out. These key on target count.
  #
  # Three is the cluster's node count, hardcoded because the count itself is
  # only knowable from kube-state-metrics, which is one of the things that
  # goes missing. Adding a node means changing this number with it.
  - name: telemetry-coverage
    rules:
      - alert: KubeletTelemetryMissing
        expr: count(up{job="kubelet"}) < 3 or absent(up{job="kubelet"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'kubelet metrics arriving from fewer than 3 nodes — container telemetry has a blind spot'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/telemetry-coverage.md

      - alert: CadvisorTelemetryMissing
        expr: count(up{job="cadvisor"}) < 3 or absent(up{job="cadvisor"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'cAdvisor metrics arriving from fewer than 3 nodes — per-container CPU and memory has a blind spot'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/telemetry-coverage.md

      # Scoped to the cluster nodes: this job also carries the VMs and bare
      # metal outside the cluster, which reach Prometheus through the Ingress
      # and are unaffected by anything inside it.
      - alert: NodeExporterTelemetryMissing
        expr: |
          count(up{job="integrations/unix", instance=~"k8s-hawk-.+"}) < 3
            or
          absent(up{job="integrations/unix", instance=~"k8s-hawk-.+"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'host metrics arriving from fewer than 3 cluster nodes — node CPU, memory and disk has a blind spot'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/telemetry-coverage.md

      # One instance cluster-wide, so this is absent-or-nothing rather than a
      # count. Every kube_* series in Grafana and the pod-restart alerts above
      # depend on it.
      - alert: KubeStateMetricsMissing
        expr: absent(kube_pod_info)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'no kube-state-metrics series at all — pod restart and crashloop alerts cannot fire'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/telemetry-coverage.md

  # unpoller serves a 60s cache rather than polling on scrape, so every value
  # here is up to a minute stale. Nothing below has a `for` shorter than 5m,
  # which keeps that staleness well inside the noise.
  #
  # Hawkfield cannot alert on the loss of its own WAN — Prometheus, Alertmanager
  # and Telegram's only egress all sit behind it. That alert comes from the
  # London watchdog instead (terraform/watchdog).
  - name: unifi-reachability
    rules:
      # Cannot tell "the console is down" from "the path to it is down": the
      # poller runs at Hawkfield, so London going unreachable could equally be
      # the site-to-site link. The runbook discriminates; the summary does not
      # pretend to.
      - alert: UniFiConsoleUnreachable
        expr: unpoller_controller_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'UniFi console unreachable from the poller — console, or the path to it'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

      - alert: UniFiPollerRefreshFailing
        expr: increase(unpoller_prometheus_refresh_failures_total[15m]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'unpoller failed {{ $value | printf "%.0f" }} refreshes in 15m — series are going stale'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

  - name: unifi-wan
    rules:
      # Both sites idle at 3-4 ms, so 100 ms is well clear of normal without
      # being so high that it only fires once the line is unusable.
      - alert: UniFiWanLatencyHigh
        expr: unpoller_site_latency_seconds{subsystem="www"} > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'WAN latency {{ $value | humanizeDuration }} sustained over 15 minutes'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

      - alert: UniFiInternetDropping
        expr: increase(unpoller_site_intenet_drops_total[1h]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'WAN dropped {{ $value | printf "%.0f" }} times in the last hour'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

  # The aggregation switch carries the 10G spine but uplinks to the Loft Switch
  # over a 2x1G LAG on ports 7/8 — the USL24P's SFP ports are 1G-only. Lose a
  # member and north-south capacity halves to 1 Gbps while every other panel and
  # every other alert still reads healthy. Nothing else in the estate sees this.
  #
  # Total loss of the switch is deliberately not handled here; that surfaces as
  # UniFiDevicesDisconnected rather than as a second copy of this alert.
  - name: unifi-aggregation-lag
    rules:
      - alert: UniFiAggregationLagMemberDown
        expr: |
          count by (site, name) (
            unpoller_device_port_port_speed_bps{name="USW Aggregation", port_num=~"7|8"} > 0
          ) < 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'aggregation LAG down to {{ $value | printf "%.0f" }} of 2 members — uplink capacity halved'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

      - alert: UniFiAggregationLagMemberSlow
        expr: unpoller_device_port_port_speed_bps{name="USW Aggregation", port_num=~"7|8"} > 0 < 1e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'LAG member negotiated {{ $value | printf "%.0f" }} bps, below the expected 1G'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

  - name: unifi-devices
    rules:
      # Site-level rather than per-device: unpoller reports a disconnected count
      # per subsystem, which is a fact it publishes directly, whereas naming the
      # device depends on whether an offline device is dropped from the export
      # or merely reported stale. The runbook has the query that names it.
      - alert: UniFiDevicesDisconnected
        expr: unpoller_site_disconnected > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | printf "%.0f" }} {{ $labels.subsystem }} device(s) disconnected'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

      # Catches a device that re-adopts in a loop, which the disconnected count
      # misses whenever the flap settles between two refreshes.
      - alert: UniFiDeviceRebooting
        expr: resets(unpoller_device_uptime_seconds[1h]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'rebooted {{ $value | printf "%.0f" }} times in the last hour'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

  # Thresholds here are deliberate guesses. #443 had run for three hours when
  # these were written, so each one is set clear of the observed idle rather
  # than derived from a baseline, and is meant to be revisited against real
  # data. Gateway memory is the exception and lives in its own group below,
  # anchored on earlyoom's own constants rather than on a guess.
  - name: unifi-health
    rules:
      # Observed idle: Bristol 67 CPU / 71 board, London 74 CPU / 77 board.
      - alert: UniFiDeviceTemperatureHigh
        expr: unpoller_device_temperature_celsius > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.temp_area }} at {{ $value | printf "%.1f" }}°C for 15 minutes'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

      - alert: UniFiDeviceTemperatureCritical
        expr: unpoller_device_temperature_celsius > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.temp_area }} at {{ $value | printf "%.1f" }}°C — thermal, check airflow'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

      - alert: UniFiDeviceCpuHigh
        expr: unpoller_device_cpu_utilization_ratio > 0.9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'CPU at {{ $value | humanizePercentage }} for 30 minutes'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

      # max_power_total is 0 on the aggregation switch, which has no PoE at all,
      # so filter it out rather than dividing by zero into +Inf.
      - alert: UniFiPoeBudgetHigh
        expr: |
          sum by (site, name) (unpoller_device_port_poe_watts)
            / on (site, name) (max by (site, name) (unpoller_device_max_power_total > 0))
            > 0.8
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'PoE draw at {{ $value | humanizePercentage }} of the switch budget'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

      - alert: UniFiSwitchPortErrors
        expr: |
          rate(unpoller_device_port_receive_errors_total[15m]) > 1
            or rate(unpoller_device_port_transmit_errors_total[15m]) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | printf "%.1f" }} errors/s on {{ $labels.port_name }} — suspect cable or SFP'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

      # 5 GHz only. 2.4 GHz is congested by neighbours and IoT and already peaks
      # over 50% at idle here, so alerting on it would be noise you cannot act
      # on. 5 GHz is where the 33.8 Mbps Plex remux ceiling lives.
      - alert: UniFiWifiChannelUtilisationHigh
        expr: unpoller_device_radio_channel_utilization_total_ratio{band="5"} > 0.75
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '5GHz channel {{ $value | humanizePercentage }} utilised for 30 minutes'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

  # Gateway memory, added by #480 after unifi-core leaked ~30 MB/day into an
  # earlyoom kill loop that took the Hawkfield console down for 15 minutes.
  #
  # #445 shipped no rule here because the UDMs idle at 83-86% used, so any
  # static utilisation threshold fires immediately or never fires in time.
  # That reasoning held for utilisation; it does not hold for headroom.
  #
  # `installed - used` is MemAvailable. unpoller reports used as
  # MemTotal - MemAvailable, verified against /proc/meminfo on both consoles
  # (1676608 kB reported vs 1677908 kB measured), so the difference is the
  # exact quantity earlyoom gates on and not a cache-inflated proxy.
  #
  # earlyoom on UniFi OS runs with `-M 256000 -s 10` and kills only when
  # memory AND swap are both under, having been told to `--avoid` unifi-core
  # itself. So the leaker is spared and the Network application is killed in
  # its place. 256000 kB is the 262144000 below: both rules sit on earlyoom's
  # own line rather than on a number we picked.
  - name: unifi-gateway-memory
    rules:
      # Headroom swings +/-70 MB with page cache churn, which is wider than a
      # day of the leak, so every rule here reads the 3h average instead.
      # `max by` drops site_name and source: renaming a site mid-leak already
      # split this series once, and predict_linear across that split projects
      # nonsense.
      #
      # Recorded for the dashboards and for the Critical rule below, both of
      # which only ever read its current value. The predicted rule deliberately
      # does NOT read it — see there.
      - record: gateway:unifi_memory_available_bytes:avg3h
        expr: |
          avg_over_time(
            (
              max by (site, name) (unpoller_device_memory_installed_bytes{type="udm"})
                - max by (site, name) (unpoller_device_memory_used_bytes{type="udm"})
            )[3h:1m]
          )

      # The rule the incident asked for. Replayed against 11-18 Aug it first
      # fires 14 Aug 06:00 and stays firing to the 17 Aug 21:22 kill loop —
      # 3.6 days of warning — and clears within two hours of the restart.
      # 48h of lookahead is what buys that lead; 24h of window is what stops
      # the diurnal swing from fitting a slope of its own.
      #
      # This fits the raw expression through a subquery rather than reading
      # gateway:unifi_memory_available_bytes:avg3h, which would be tidier and
      # is wrong. A recorded series only exists from the moment it is first
      # evaluated, so on deploy predict_linear fits a handful of noisy points
      # and extrapolates them 48h: at rollout it projected -1070 MB against
      # 361 MB of real headroom and went pending on both consoles. The raw
      # metrics carry full retention, so the subquery is right on its first
      # evaluation. It costs 288 samples and ~2ms.
      #
      # The count guard is the same failure caught generically: below 20h of
      # history — a rebuilt TSDB, a newly added console — the fit is noise, so
      # say nothing rather than guess. 145 is a full [24h:10m] window.
      - alert: UniFiGatewayMemoryExhaustionPredicted
        expr: |
          predict_linear(
            avg_over_time(
              (
                max by (site, name) (unpoller_device_memory_installed_bytes{type="udm"})
                  - max by (site, name) (unpoller_device_memory_used_bytes{type="udm"})
              )[3h:1m]
            )[24h:10m], 48 * 3600
          ) < 262144000
            and
          count_over_time(
            (
              max by (site, name) (unpoller_device_memory_installed_bytes{type="udm"})
                - max by (site, name) (unpoller_device_memory_used_bytes{type="udm"})
            )[24h:10m]
          ) >= 120
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: 'projected to reach the earlyoom line within 48h — {{ $value | humanize1024 }}B headroom projected'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md

      # Already at the line. earlyoom needs swap under 10% as well, so this is
      # not yet a kill — it is the last quiet moment before one.
      - alert: UniFiGatewayMemoryCritical
        expr: gateway:unifi_memory_available_bytes:avg3h < 262144000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'only {{ $value | humanize1024 }}B free — earlyoom kills the Network app once swap drains'
          runbook_url: https://github.com/clincha-org/clincha/blob/master/Documentation/runbooks/unifi-network.md
