global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager.monitoring.svc:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  # TrueNAS (hawkstore) metrics: pushed via Graphite to the graphite_exporter,
  # re-exposed in Prometheus format and scraped here. Single scrape point.
  - job_name: truenas-hawkstore
    static_configs:
      - targets: ['graphite-exporter.monitoring.svc:9108']
  # TrueNAS depth (ZFS pools/datasets/scrub + disk temps) polled from the NAS
  # API by truenas-api-exporter. Each scrape is a full API roundtrip, so poll
  # gently.
  - job_name: truenas-api
    scrape_interval: 60s
    static_configs:
      - targets: ['truenas-api-exporter.monitoring.svc:9113']
  # UniFi consoles at both sites via unpoller. It refreshes its own cache on a
  # 60s timer and serves that cache, so a scrape costs the UDMs nothing and
  # returns in ~50ms. Scraped at 30s rather than 60s because two independent
  # 60s cycles drift in and out of phase, which would alias a refresh away and
  # leave gaps of up to two minutes in what is meant to catch WiFi and WAN
  # transients.
  - job_name: unifi
    scrape_interval: 30s
    static_configs:
      - targets: ['unpoller.monitoring.svc:9130']
    metric_relabel_configs:
      # Neither label unpoller emits is a usable site key: `source` is the
      # console URL and `site_name` is the console's own description, which
      # is still "Default (default)" at London. Derive `site` from the URL.
      - source_labels: [source]
        regex: 'https://10\.1\.2\.1'
        target_label: site
        replacement: hawkfield
      - source_labels: [source]
        regex: 'https://10\.2\.2\.1'
        target_label: site
        replacement: london
      # unpoller_port_forward_* and unpoller_wan_* carry no `source` at all,
      # so the rules above leave them site-less. The pairs below read as
      # "site still empty AND <fallback label> says Hawkfield", because an
      # unset label contributes nothing before the `;` separator; a series
      # already carrying a site cannot re-match. Each fallback matches
      # Hawkfield by name and treats any other value as London, so renaming
      # the London site — which #443 recommends — cannot silently strand
      # its series. A third site would need a rule of its own.
      - source_labels: [site, site_name]
        regex: ';Hawkfield Lodge.*'
        target_label: site
        replacement: hawkfield
      - source_labels: [site, site_name]
        regex: ';.+'
        target_label: site
        replacement: london
      # WAN config series identify themselves only by ISP.
      - source_labels: [site, wan_name]
        regex: ';Truespeed'
        target_label: site
        replacement: hawkfield
      - source_labels: [site, wan_name]
        regex: ';.+'
        target_label: site
        replacement: london
  # Library composition, Plex playback decisions and Tdarr encode progress,
  # polled from the Radarr/Sonarr/Tdarr/Tautulli APIs by media-exporter in the
  # media namespace (clincha/media#50). It serves a cached payload built on its
  # own 15m timer, so a scrape never reaches those APIs and costs nothing.
  # Scraped rather than pushed: monitoring's default-deny-ingress admits no
  # remote-write from another namespace, and media has no ingress policy of its
  # own — see #487.
  - job_name: media-exporter
    scrape_interval: 60s
    static_configs:
      - targets: ['media-exporter.media.svc:9114']
  # Account growth, wishlist/circle/reservation counts and mail-delivery
  # outcomes, served on a port separate from the public 8080 the Ingress
  # proxies. Needs its own NetworkPolicy rule (giftlist's default-deny
  # otherwise blocks this namespace too) — see #487.
  - job_name: giftlist
    scrape_interval: 30s
    static_configs:
      - targets: ['giftlist.giftlist.svc:9090']
