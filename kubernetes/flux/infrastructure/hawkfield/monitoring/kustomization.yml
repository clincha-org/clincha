apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: monitoring
resources:
  - ../../base/monitoring
  - grafana-admin-credentials.yaml
configMapGenerator:
  - name: prometheus-values
    namespace: monitoring
    files:
      - values.yml
    options:
      disableNameSuffixHash: true