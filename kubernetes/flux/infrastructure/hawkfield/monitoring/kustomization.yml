apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: monitoring
resources:
  - ../../base/monitoring
  - truenas-api-key.sops.yaml
  - loki-rustfs-creds.sops.yaml
  - alertmanager-telegram.sops.yaml
configurations:
  - nameref-helmrelease.yml
configMapGenerator:
  - name: prometheus.yml
    namespace: monitoring
    files:
      - prometheus.yml
  - name: prometheus-rules
    namespace: monitoring
    files:
      - alert-rules.yml
  - name: alertmanager.yml
    namespace: monitoring
    files:
      - alertmanager.yml
  - name: alloy-values
    namespace: monitoring
    files:
      - values.yml=alloy-values.yml
  - name: alloy-config
    namespace: monitoring
    files:
      - config.alloy
    # Flag kept: the name lives inside alloy-values.yml's file content, which
    # kustomize can't rewrite. Edits here still need a manual rollout restart.
    options:
      disableNameSuffixHash: true
  - name: loki-values
    namespace: monitoring
    files:
      - values.yml=loki-values.yml
  - name: graphite-mapping
    namespace: monitoring
    files:
      - graphite_mapping.conf
  - name: alloy-syslog-config
    namespace: monitoring
    files:
      - config-syslog.alloy
  - name: truenas-exporter-script
    namespace: monitoring
    files:
      - truenas_exporter.py