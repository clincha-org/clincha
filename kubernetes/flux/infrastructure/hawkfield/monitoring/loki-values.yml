fullnameOverride: loki
deploymentMode: SingleBinary

global:
  clusterDomain: "hawkfield.clinch-home.com"
  dnsService: "coredns"

loki:
  auth_enabled: false
  # The export is root_squash, so run as the hawkstore loki user rather than the
  # chart default 10001. fsGroupChangePolicy is dropped: recursive chown of the
  # mount is pointless on NFS and the dataset is already owned 3018:3018.
  podSecurityContext:
    runAsUser: 3018
    runAsGroup: 3018
    fsGroup: 3018
    runAsNonRoot: true
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-data
      ruler: loki-data
      admin: loki-data
    s3:
      endpoint: http://10.1.2.10:30293
      region: uk-hawk-01
      accessKeyId: ${S3_ACCESS_KEY_ID}
      secretAccessKey: ${S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true
  limits_config:
    retention_period: 730d
    reject_old_samples: true
    reject_old_samples_max_age: 7d
  # The chart emits no compactor section, and retention_period alone does
  # nothing — deletion is the compactor's job and it defaults to off.
  # delete_request_store is mandatory once retention_enabled is true.
  structuredConfig:
    compactor:
      retention_enabled: true
      delete_request_store: s3
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  # The single-binary StatefulSet template only reads singleBinary.extraArgs /
  # singleBinary.extraEnvFrom; it does NOT concat global.extraArgs/extraEnvFrom
  # like every other component does. So these must live here, not under global.
  extraArgs:
    - "-config.expand-env=true"
  extraEnvFrom:
    - secretRef:
        name: loki-rustfs-creds
  # /var/loki is WAL + tsdb-shipper index cache only; the durable chunks live in
  # RustFS. Mounted from hawkstore NFS rather than a PVC — a Longhorn journal
  # abort silently wedged this volume with EIO for 18 days on 2026-07-08.
  persistence:
    enabled: false
  extraVolumes:
    - name: storage
      nfs:
        server: 10.1.2.10
        path: /mnt/userstore/loki
  extraVolumeMounts:
    - name: storage
      mountPath: /var/loki

backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}

chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}

gateway:
  enabled: true
  # Log only non-2xx/3xx responses so successful Alloy pushes stop flooding Loki
  verboseLogging: false
