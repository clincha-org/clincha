fullnameOverride: loki
deploymentMode: SingleBinary

global:
  clusterDomain: "hawkfield.clinch-home.com"
  dnsService: "coredns"

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-data
      ruler: loki-data
      admin: loki-data
    s3:
      endpoint: http://10.1.2.10:9000
      region: uk-hawk-01
      accessKeyId: ${S3_ACCESS_KEY_ID}
      secretAccessKey: ${S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true
  limits_config:
    retention_period: 90d
    reject_old_samples: true
    reject_old_samples_max_age: 7d
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  # The single-binary StatefulSet template only reads singleBinary.extraArgs /
  # singleBinary.extraEnvFrom; it does NOT concat global.extraArgs/extraEnvFrom
  # like every other component does. So these must live here, not under global.
  extraArgs:
    - "-config.expand-env=true"
  extraEnvFrom:
    - secretRef:
        name: loki-minio-creds
  persistence:
    enabled: true
    size: 10Gi
    storageClass: longhorn

backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }

chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }

gateway:
  enabled: true
  # Log only non-2xx/3xx responses so successful Alloy pushes stop flooding Loki
  verboseLogging: false
