global:
  resolve_timeout: 5m

route:
  receiver: telegram
  # `site` and `name` are absent on the pod alerts, which groups them exactly as
  # before. Without them every UniFi alert of one name collapses into a single
  # group, so seven APs dropping would arrive as one message naming none of them.
  group_by: ['alertname', 'namespace', 'site', 'name']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  routes:
    # First, and never muted: this one is the heartbeat, not an alert. It goes
    # to London rather than to Angus, and must keep flowing through quiet
    # hours or the watchdog would fire every night at 23:00.
    - receiver: watchdog
      matchers:
        - alertname = "Watchdog"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    - receiver: telegram
      matchers:
        - severity = "critical"
    - receiver: telegram
      matchers:
        - severity = "warning"
      mute_time_intervals:
        - overnight
      # Retries every 4h, so a warning raised inside the quiet window lands
      # within an hour or so of it lifting, rather than waiting on the 6h
      # default.
      repeat_interval: 4h

time_intervals:
  - name: overnight
    time_intervals:
      - location: Europe/London
        times:
          - start_time: '23:00'
            end_time: '24:00'
          - start_time: '00:00'
            end_time: '06:00'

receivers:
  # The URL carries the push token, so it comes from SOPS rather than sitting
  # in this file — the repo is public.
  - name: watchdog
    webhook_configs:
      - url_file: /etc/alertmanager-watchdog/push-url
        send_resolved: false

  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager-secrets/bot-token
        chat_id_file: /etc/alertmanager-secrets/chat-id
        parse_mode: HTML
        send_resolved: true
        # Pod alerts identify by namespace/pod, UniFi alerts by site/device —
        # they share no labels, so the subject line has to branch. Without this
        # every network alert renders as a bare "/".
        message: |-
          {{ if eq .Status "firing" }}🔴 <b>FIRING</b>
          {{- else }}✅ <b>RESOLVED</b>
          {{- end }} — {{ .CommonLabels.alertname }}
          {{ range .Alerts -}}
          {{ if .Labels.namespace }}<b>{{ .Labels.namespace }}/{{ .Labels.pod }}</b>
          {{- if .Labels.container }} ({{ .Labels.container }})
          {{- end }}
          {{- else if .Labels.name }}<b>{{ .Labels.site }} / {{ .Labels.name }}</b>
          {{- if .Labels.port_name }} ({{ .Labels.port_name }})
          {{- end }}
          {{- else if .Labels.site }}<b>{{ .Labels.site }}</b>
          {{- if .Labels.subsystem }} ({{ .Labels.subsystem }})
          {{- end }}
          {{- end }}
          {{ .Annotations.summary }}
          {{- if .Annotations.runbook_url }}
          <a href="{{ .Annotations.runbook_url }}">Runbook</a>
          {{- end }}
          {{ end }}
