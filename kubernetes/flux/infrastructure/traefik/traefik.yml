apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  targetNamespace: traefik
  interval: 1m
  chart:
    spec:
      chart: traefik
      version: '36.3.0'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
      valuesKey: values.yaml