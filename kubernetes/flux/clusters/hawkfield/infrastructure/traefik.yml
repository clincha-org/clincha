---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1m
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/infrastructure/hawkfield/traefik
  dependsOn:
    - name: metallb-configuration
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg