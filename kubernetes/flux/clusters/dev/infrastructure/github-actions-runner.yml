---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-actions-runner-controller-dev
  namespace: flux-system
spec:
  interval: 1m
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/infrastructure/dev/github-actions-runner/controller
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-actions-runner-configuration-dev
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/infrastructure/dev/github-actions-runner/configuration
  dependsOn:
    - name: github-actions-runner-controller-dev
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg