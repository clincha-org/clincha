---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: elastic-operator-dev
  namespace: flux-system
spec:
  interval: 1m
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/infrastructure/dev/elastic-operator
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg