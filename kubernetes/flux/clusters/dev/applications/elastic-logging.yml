---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: elastic-logging-dev
  namespace: flux-system
spec:
  interval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/applications/dev/elastic-logging
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg