---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-controller-dev
  namespace: flux-system
spec:
  interval: 1m
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/apps/dev/longhorn/controller
  dependsOn:
    - name: certificate-manager-configuration-dev
    - name: metallb-configuration-dev
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-configuration-dev
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/apps/dev/longhorn/configuration
  dependsOn:
    - name: longhorn-controller-dev
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg