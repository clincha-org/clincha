---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-controller
  namespace: flux-system
spec:
  interval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/infrastructure/dev/longhorn/controller
  dependsOn:
    - name: certificate-manager-configuration
    - name: metallb-configuration
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-configuration
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/infrastructure/dev/longhorn/configuration
  dependsOn:
    - name: longhorn-controller
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg