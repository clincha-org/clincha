---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: elastic-finance
  namespace: flux-system
spec:
  interval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/flux/applications/dev/elastic-finance
  dependsOn:
    - name: elastic-operator
    - name: certificate-manager-configuration
    - name: metallb-configuration
    - name: traefik
    - name: longhorn-configuration
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg