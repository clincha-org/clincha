          proxmox_token_secret_name: HAWKFIELD_PROXMOX_TOKEN_SECRET
        hawk02:
          ansible_host: 10.1.2.12
        hawk03:
          ansible_host: 10.1.2.13
        london01:
          ansible_host: 10.2.2.11
          proxmox_token_secret_name: LONDON_PROXMOX_TOKEN_SECRET
    proxmox_api_primary:
      hosts:
        hawk01:
        london01:
