---
ansible_user: root
ansible_ssh_pass: null

# Cloudflare publishes ECH configs (DNS type 65) for proxied hostnames. Local A
# records come from /etc/hosts, which cannot answer type 65, so LAN browsers get
# Cloudflare's ECH config and fail TLS against the internal ingress with
# ERR_ECH_FALLBACK_CERTIFICATE_INVALID.
adguard_user_rules:
  - "||clinch-home.com^$dnstype=HTTPS"
  - "||clincha.co.uk^$dnstype=HTTPS"

adguard_local_dns_entries:
  # Proxmox hosts
  - domain: "hawk01.clinch-home.com"
    answer: "10.1.2.11"
  - domain: "hawk02.clinch-home.com"
    answer: "10.1.2.12"
  - domain: "hawk03.clinch-home.com"
    answer: "10.1.2.13"
  - domain: "lon01.clinch-home.com"
    answer: "10.2.2.11"

  # NAS
  - domain: "hawkstore.clinch-home.com"
    answer: "10.1.2.10"
  - domain: "nas.clinch-home.com"
    answer: "10.1.2.10"

  # DNS servers
  - domain: "dns-hawk-1.clinch-home.com"
    answer: "10.1.2.131"
  - domain: "dns-lon-1.clinch-home.com"
    answer: "10.2.2.131"

