---
- name: "Proxmox host configuration"
  hosts: proxmox_nodes
  become: true
  vars:
    debian_codename: >-
      {{ ansible_facts['distribution_release'] }}
    ceph_flavour: >-
      {{ (debian_codename == 'trixie')
         | ternary('ceph-squid', 'ceph-reef') }}
    # VM.Monitor (PVE 8) was split into VM.GuestAgent.* in PVE 9
    pve_monitor_privs: >-
      {{ (ansible_facts['distribution_major_version']
          | int >= 13)
         | ternary(['VM.GuestAgent.Audit'],
                   ['VM.Monitor']) }}
    proxmox_roles:
      - name: Ansible
        privs:
          - Pool.Audit
          - Sys.Audit
          - VM.Audit
      - name: Packer
        privs: >-
          {{ ['Datastore.Allocate',
              'Datastore.AllocateSpace',
              'Datastore.AllocateTemplate',
              'Datastore.Audit',
              'Pool.Allocate', 'Pool.Audit',
              'SDN.Use',
              'Sys.Audit', 'Sys.Console',
              'Sys.Modify',
              'VM.Allocate', 'VM.Audit',
              'VM.Clone',
              'VM.Config.CDROM', 'VM.Config.CPU',
              'VM.Config.Cloudinit',
              'VM.Config.Disk',
              'VM.Config.HWType',
              'VM.Config.Memory',
              'VM.Config.Network',
              'VM.Config.Options', 'VM.Console',
              'VM.Migrate', 'VM.PowerMgmt']
             + pve_monitor_privs }}
      - name: Terraform
        privs:
          - Datastore.AllocateSpace
          - Datastore.AllocateTemplate
          - Datastore.Audit
          - Pool.Allocate
          - Pool.Audit
          - SDN.Use
          - Sys.Audit
          - Sys.Console
          - Sys.Modify
          - VM.Allocate
          - VM.Audit
          - VM.Clone
          - VM.Config.CDROM
          - VM.Config.CPU
          - VM.Config.Cloudinit
          - VM.Config.Disk
          - VM.Config.HWType
          - VM.Config.Memory
          - VM.Config.Network
          - VM.Config.Options
          - VM.Console
          - VM.Migrate
          - VM.PowerMgmt
  tasks:
    - name: "Install sudo"
      ansible.builtin.package:
        name: sudo
        state: present

    - name: "Ensure clincha user exists"
      ansible.builtin.user:
        name: clincha
        shell: /bin/bash
        groups: sudo
        append: true

    - name: "Install SSH key for clincha"
      ansible.posix.authorized_key:
        user: clincha
        state: present
        key: "https://github.com/clincha.keys"

    - name: "Sudoers rule for clincha"
      ansible.builtin.copy:
        content: "clincha ALL=(ALL) NOPASSWD:ALL\n"
        dest: /etc/sudoers.d/clincha
        validate: "visudo -cf %s"
        mode: "0440"

    - name: "Remove PVE enterprise repo"
      ansible.builtin.file:
        path: >-
          /etc/apt/sources.list.d/pve-enterprise.{{
          item }}
        state: absent
      loop:
        - list
        - sources

    - name: "Remove Ceph enterprise repo"
      ansible.builtin.file:
        path: >-
          /etc/apt/sources.list.d/ceph.{{ item }}
        state: absent
      loop:
        - list
        - sources

    - name: "Add PVE no-subscription repo"
      ansible.builtin.apt_repository:
        repo: >-
          deb http://download.proxmox.com/debian/pve
          {{ debian_codename }} pve-no-subscription
        filename: pve-no-subscription
        state: present

    - name: "Add Ceph no-subscription repo"
      ansible.builtin.apt_repository:
        repo: >-
          deb http://download.proxmox.com/debian/{{
          ceph_flavour }} {{ debian_codename }}
          no-subscription
        filename: ceph-no-subscription
        state: present

    - name: "Fetch Ubuntu SHA256SUMS"
      ansible.builtin.uri:
        url: >-
          https://releases.ubuntu.com/noble/SHA256SUMS
        return_content: true
      register: sha256sums

    - name: "Parse latest live-server ISO entry"
      vars:
        filename_pattern: >-
          \S+\s+\*?(ubuntu-.*-live-server-amd64\.iso)$
        checksum_pattern: >-
          (\S+)\s+\*?ubuntu-.*-live-server-amd64\.iso$
      ansible.builtin.set_fact:
        iso_filename: >-
          {{ sha256sums.content |
             regex_search(filename_pattern, '\1',
             multiline=True) |
             last }}
        iso_checksum: >-
          {{ sha256sums.content |
             regex_search(checksum_pattern, '\1',
             multiline=True) |
             last }}

    - name: "Download Ubuntu ISO"
      ansible.builtin.get_url:
        url: >-
          https://releases.ubuntu.com/noble/{{
          iso_filename }}
        dest: "/var/lib/vz/template/iso/ubuntu.iso"
        checksum: "sha256:{{ iso_checksum }}"
        owner: root
        group: root
        mode: "0644"

    - name: "Download Debian 12 LXC template"
      ansible.builtin.command:
        cmd: >-
          pveam download local
          debian-12-standard_12.7-1_amd64.tar.zst
        creates: >-
          /var/lib/vz/template/cache/debian-12-standard_12.7-1_amd64.tar.zst

    - name: "Get current Proxmox roles"
      ansible.builtin.command: >-
        pveum role list --output-format json
      register: pveum_roles
      changed_when: false

    - name: "Create Proxmox roles"
      ansible.builtin.command:
        cmd: >-
          pveum role add {{ item.name }}
          --privs {{ item.privs | join(',') }}
      loop: "{{ proxmox_roles }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      when: >-
        pveum_roles.stdout | from_json |
        selectattr('roleid', 'eq', item.name) |
        list | length == 0

    - name: "Ensure Proxmox role privileges"
      vars:
        existing_privs: >-
          {{ (pveum_roles.stdout | from_json |
              selectattr('roleid', 'eq', item.name)
              | first).privs | default('')
              | split(',') | sort | join(',') }}
      ansible.builtin.command:
        cmd: >-
          pveum role modify {{ item.name }}
          --privs {{ item.privs | join(',') }}
      loop: "{{ proxmox_roles }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      when:
        - >-
          pveum_roles.stdout | from_json
          | selectattr('roleid', 'eq', item.name)
          | list | length > 0
        - >-
          existing_privs !=
          (item.privs | sort | join(','))

    - name: "Create API users"
      ansible.builtin.command:
        cmd: >-
          pveum user add {{ item }}@pam
      loop:
        - ansible
        - packer
        - terraform
      register: user_result
      changed_when: user_result.rc == 0
      failed_when: >-
        user_result.rc != 0 and
        'already exists' not in user_result.stderr

    - name: "Get current Proxmox ACLs"
      ansible.builtin.command: >-
        pveum acl list --output-format json
      register: pveum_acls
      changed_when: false

    - name: "Assign user roles"
      ansible.builtin.command:
        cmd: >-
          pveum acl modify /
          --users {{ item.user }}@pam
          --roles {{ item.role }}
      loop:
        - {user: ansible, role: Ansible}
        - {user: packer, role: Packer}
        - {user: terraform, role: Terraform}
      loop_control:
        label: "{{ item.user }} -> {{ item.role }}"
      changed_when: true
      when: >-
        pveum_acls.stdout | from_json |
        selectattr('path', 'eq', '/') |
        selectattr('ugid', 'eq', item.user ~ '@pam') |
        selectattr('roleid', 'eq', item.role) |
        list | length == 0
