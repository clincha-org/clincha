---
- name: Check if AdGuard Home binary exists
  ansible.builtin.stat:
    path: /opt/AdGuardHome/AdGuardHome
  register: adguard_binary

- name: Install passlib for bcrypt password hashing
  ansible.builtin.pip:
    name: passlib[bcrypt]
    state: present

- name: Download AdGuard Home
  vars:
    base: "https://github.com/AdguardTeam"
    repo: "AdGuardHome/releases/download"
    tarball: "AdGuardHome_{{ adguard_arch }}.tar.gz"
  ansible.builtin.get_url:
    url: "{{ base }}/{{ repo }}/{{ adguard_version }}/{{ tarball }}"
    dest: /tmp/AdGuardHome.tar.gz
    mode: "0644"
  when: not adguard_binary.stat.exists

- name: Extract AdGuard Home
  ansible.builtin.unarchive:
    src: /tmp/AdGuardHome.tar.gz
    dest: /opt/
    remote_src: true
  when: not adguard_binary.stat.exists

- name: Install AdGuard Home as systemd service
  ansible.builtin.command:
    cmd: /opt/AdGuardHome/AdGuardHome -s install
  changed_when: true
  when: not adguard_binary.stat.exists

- name: Ensure AdGuard Home service is enabled and started
  ansible.builtin.systemd:
    name: AdGuardHome
    enabled: true
    state: started
