---
- name: Check if Pi-hole is installed
  ansible.builtin.stat:
    path: /usr/local/bin/pihole
  register: pihole_binary

- name: Create Pi-hole config directory
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    mode: "0755"
  when: not pihole_binary.stat.exists

- name: Template setupVars.conf for unattended install
  ansible.builtin.template:
    src: setupVars.conf.j2
    dest: /etc/pihole/setupVars.conf
    mode: "0644"
  when: not pihole_binary.stat.exists

- name: Download Pi-hole installer
  ansible.builtin.get_url:
    url: https://install.pi-hole.net
    dest: /tmp/pihole-install.sh
    mode: "0755"
  when: not pihole_binary.stat.exists

- name: Install Pi-hole (unattended)
  ansible.builtin.command:
    cmd: bash /tmp/pihole-install.sh --unattended
  when: not pihole_binary.stat.exists
  changed_when: true

- name: Remove installer script
  ansible.builtin.file:
    path: /tmp/pihole-install.sh
    state: absent
