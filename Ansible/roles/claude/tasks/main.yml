---
- name: "Ensure .ssh directory exists for claude user"
  ansible.builtin.file:
    path: /home/claude/.ssh
    state: directory
    owner: claude
    group: claude
    mode: "0700"

- name: "Deploy SSH private key for claude user"
  ansible.builtin.copy:
    content: "{{ lookup('env', 'CLAUDE_SSH_PRIVATE_KEY') }}\n"
    dest: /home/claude/.ssh/id_ed25519
    owner: claude
    group: claude
    mode: "0600"

- name: "Download Claude Code installer"
  ansible.builtin.get_url:
    url: "https://claude.ai/install.sh"
    dest: /tmp/claude-install.sh
    mode: "0755"

- name: "Install Claude Code"
  ansible.builtin.command:
    cmd: "bash /tmp/claude-install.sh"
    creates: /home/claude/.local/bin/claude
  become: true
  become_user: claude

- name: "Ensure .claude directory exists"
  ansible.builtin.file:
    path: /home/claude/.claude
    state: directory
    owner: claude
    group: claude
    mode: "0755"

- name: "Deploy OAuth credentials"
  ansible.builtin.copy:
    content: "{{ lookup('env', 'CLAUDE_OAUTH_CREDENTIALS') }}"
    dest: /home/claude/.claude/.credentials.json
    owner: claude
    group: claude
    mode: "0600"

- name: "Deploy Claude Code settings"
  ansible.builtin.copy:
    content: '{"permissions":{"defaultMode":"bypassPermissions"}}'
    dest: /home/claude/.claude/settings.json
    owner: claude
    group: claude
    mode: "0644"

- name: "Trust home workspace"
  ansible.builtin.command:
    cmd: >-
      python3 -c "
      import json;
      f='/home/claude/.claude.json';
      d=json.load(open(f)) if __import__('os').path.exists(f) else {};
      d.setdefault('projects',{}).setdefault('/home/claude',{})['hasTrustDialogAccepted']=True;
      json.dump(d,open(f,'w'))
      "
  become: true
  become_user: claude
  changed_when: true

- name: "Verify Claude Code installation"
  ansible.builtin.command:
    cmd: /home/claude/.local/bin/claude --version
  become: true
  become_user: claude
  changed_when: false
