---
- name: "Create ansible Linux user on all Proxmox nodes"
  hosts: proxmox_nodes
  become: true
  tasks:
    - name: "Install sudo"
      ansible.builtin.package:
        name: sudo
        state: present

    - name: "Create ansible user"
      ansible.builtin.user:
        name: ansible
        uid: 1000
        shell: /bin/bash

    - name: "Set SSH authorized key for ansible"
      ansible.posix.authorized_key:
        user: ansible
        key: >-
          ssh-ed25519
          AAAAC3NzaC1lZDI1NTE5AAAAIL0PsOw/7B9Qr16/iKa2h3j5Nr0jZtrj+JI8qKgYSWep
          ansible

    - name: "Grant ansible passwordless sudo"
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/ansible
        owner: root
        group: root
        mode: "0440"

- name: "Create Proxmox API users, tokens, and roles"
  hosts: proxmox_api_primary
  become: true
  vars:
    token_pattern: >-
      ([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})
    api_users:
      - {user: ansible, role: Ansible}
      - {user: packer, role: Packer}
      - {user: terraform, role: Terraform}
  tasks:
    - name: "Get current Proxmox roles"
      ansible.builtin.command: pveum role list --output-format json
      register: pveum_roles
      changed_when: false

    - name: "Create Ansible role"
      ansible.builtin.command:
        cmd: >-
          pveum role add Ansible
          --privs Sys.Audit,SDN.Audit,VM.Audit,Pool.Audit
      changed_when: true
      when: >-
        pveum_roles.stdout | from_json |
        selectattr('roleid', 'eq', 'Ansible') |
        list | length == 0

    - name: "Ensure Ansible role privileges"
      vars:
        existing_privs: >-
          {{ (pveum_roles.stdout | from_json |
              selectattr('roleid', 'eq', 'Ansible')
              | first).privs | default('')
              | split(',') | sort | join(',') }}
        desired_privs: "Pool.Audit,SDN.Audit,Sys.Audit,VM.Audit"
      ansible.builtin.command:
        cmd: >-
          pveum role modify Ansible
          --privs Pool.Audit,SDN.Audit,Sys.Audit,VM.Audit
      changed_when: true
      when:
        - >-
          pveum_roles.stdout | from_json
          | selectattr('roleid', 'eq', 'Ansible')
          | list | length > 0
        - existing_privs != desired_privs

    - name: "Create API users"
      ansible.builtin.command:
        cmd: "pveum user add {{ item.user }}@pam"
      loop: "{{ api_users }}"
      loop_control:
        label: "{{ item.user }}"
      register: user_result
      changed_when: user_result.rc == 0
      failed_when: >-
        user_result.rc != 0 and
        'already exists' not in user_result.stderr

    - name: "Get current Proxmox ACLs"
      ansible.builtin.command: pveum acl list --output-format json
      register: pveum_acls
      changed_when: false

    - name: "Assign user roles"
      ansible.builtin.command:
        cmd: >-
          pveum acl modify /
          --users {{ item.user }}@pam
          --roles {{ item.role }}
      loop: "{{ api_users }}"
      loop_control:
        label: "{{ item.user }} -> {{ item.role }}"
      changed_when: true
      when: >-
        pveum_acls.stdout | from_json |
        selectattr('path', 'eq', '/') |
        selectattr('ugid', 'eq', item.user ~ '@pam') |
        selectattr('roleid', 'eq', item.role) |
        list | length == 0

    - name: "Delete existing API tokens"
      ansible.builtin.command:
        cmd: >-
          pveum user token remove {{ item.user }}@pam
          {{ item.user }}
      loop: "{{ api_users }}"
      loop_control:
        label: "{{ item.user }}"
      register: token_delete
      changed_when: token_delete.rc == 0
      failed_when: >-
        token_delete.rc != 0 and
        'does not exist' not in token_delete.stderr

    - name: "Create API tokens"
      ansible.builtin.command:
        cmd: >-
          pveum user token add {{ item.user }}@pam
          {{ item.user }} --privsep 0
      loop: "{{ api_users }}"
      loop_control:
        label: "{{ item.user }}"
      register: token_results
      changed_when: true

    - name: "Parse token values"
      ansible.builtin.set_fact:
        created_tokens: >-
          {{ created_tokens | default({}) | combine({
               item.item.user: item.stdout
               | regex_search(token_pattern, '\1')
               | first
             }) }}
      loop: "{{ token_results.results }}"
      loop_control:
        label: "{{ item.item.user }}"
      when: item.rc == 0

- name: "Update GitHub secrets with Proxmox tokens"
  hosts: localhost
  connection: local
  vars:
    api_users:
      - ansible
      - packer
      - terraform
  tasks:
    - name: "Set GitHub secrets for each site and token type"
      ansible.builtin.command:
        cmd: >-
          gh secret set
          PROXMOX_TOKEN_{{ hostvars[item.0].site | upper }}_{{ item.1 | upper }}
          --repo clincha-org/clincha
        stdin: >-
          {{ hostvars[item.0].created_tokens[item.1] }}
      loop: >-
        {{ groups['proxmox_api_primary']
           | product(api_users) | list }}
      loop_control:
        label: >-
          PROXMOX_TOKEN_{{ hostvars[item.0].site | upper
          }}_{{ item.1 | upper }}
      when: >-
        hostvars[item.0].created_tokens is defined and
        item.1 in hostvars[item.0].created_tokens
      changed_when: true
